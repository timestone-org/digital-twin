  REALTIME_REDIS_HOST: ${REDIS_HOST:?必填}
  REALTIME_REDIS_PORT: ${REDIS_PORT:-6379}
  REALTIME_REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REALTIME_REDIS_DB: ${REALTIME_REDIS_DB:-0}
  REALTIME_REDIS_TIMEOUT_S: ${REALTIME_REDIS_TIMEOUT_S:-1.0}
  REALTIME_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
  REALTIME_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REALTIME_POSTGRES_USER: ${POSTGRES_USER:?必填}
  REALTIME_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
  REALTIME_POSTGRES_DB: ${POSTGRES_DB:?必填}
  REALTIME_POSTGRES_SCHEMA: realtime
  REALTIME_POSTGRES_POOL_SIZE: ${REALTIME_POSTGRES_POOL_SIZE:-10}
  REALTIME_POSTGRES_POOL_OVERFLOW: ${REALTIME_POSTGRES_POOL_OVERFLOW:-5}
  REALTIME_POSTGRES_CONNECT_TIMEOUT_S: ${REALTIME_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
  REALTIME_POSTGRES_STATEMENT_TIMEOUT_MS: ${REALTIME_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
  REALTIME_POSTGRES_LOCK_TIMEOUT_MS: ${REALTIME_POSTGRES_LOCK_TIMEOUT_MS:-3000}
  REALTIME_APP_NAME: realtime-hub
  REALTIME_APP_ROLE: hub
  REALTIME_APP_INSTANCE:
  REALTIME_APP_LOG_LEVEL: ${REALTIME_APP_LOG_LEVEL:-INFO}
  REALTIME_APP_LOG_FORMAT: ${REALTIME_APP_LOG_FORMAT:-json}
  REALTIME_APP_HTTP_HOST: 0.0.0.0
  REALTIME_APP_HTTP_PORT: 8000
  REALTIME_APP_DRAIN_TIMEOUT_S: ${REALTIME_APP_DRAIN_TIMEOUT_S:-20.0}
  REALTIME_APP_TRACE_SAMPLE_RATIO: ${REALTIME_APP_TRACE_SAMPLE_RATIO:-0.1}
  REALTIME_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
  REALTIME_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
  REALTIME_JWT_SECRET: ${AUTH_JWT_SECRET:?必填}
  REALTIME_JWT_PREVIOUS_SECRET: ${AUTH_JWT_PREVIOUS_SECRET:-null}
  REALTIME_JWT_ISSUER: ${AUTH_JWT_ISSUER:-auth-server}
  REALTIME_AUTH_BASE_URL: ${REALTIME_AUTH_BASE_URL:-http://auth-server:8004}
  REALTIME_AUTH_TIMEOUT_S: ${REALTIME_AUTH_TIMEOUT_S:-2.0}
  REALTIME_MAX_PAYLOAD_ITEMS: ${REALTIME_MAX_PAYLOAD_ITEMS:-500}
  REALTIME_FANOUT_CHANNEL: ${REALTIME_FANOUT_CHANNEL:-realtime.fanout}
  REALTIME_PUBLIC_GRANT_TTL_S: ${REALTIME_PUBLIC_GRANT_TTL_S:-3600}
  REALTIME_PUBLIC_RECHECK_INTERVAL_S: ${REALTIME_PUBLIC_RECHECK_INTERVAL_S:-15.0}
  REALTIME_PUBLIC_MAX_CONNECTIONS: ${REALTIME_PUBLIC_MAX_CONNECTIONS:-500}
  REALTIME_PUBLIC_MAX_CONNECTIONS_PER_TICKET: ${REALTIME_PUBLIC_MAX_CONNECTIONS_PER_TICKET:-50}

x-hierarchy-environment: &hierarchy-environment
  HIERARCHY_REDIS_HOST: ${REDIS_HOST:?必填}
  HIERARCHY_REDIS_PORT: ${REDIS_PORT:-6379}
  HIERARCHY_REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  HIERARCHY_REDIS_DB: ${HIERARCHY_REDIS_DB:-0}
  HIERARCHY_REDIS_TIMEOUT_S: ${HIERARCHY_REDIS_TIMEOUT_S:-1.0}
  HIERARCHY_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
  HIERARCHY_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  HIERARCHY_POSTGRES_USER: ${POSTGRES_USER:?必填}
  HIERARCHY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
  HIERARCHY_POSTGRES_DB: ${POSTGRES_DB:?必填}
  HIERARCHY_POSTGRES_SCHEMA: hierarchy
  HIERARCHY_POSTGRES_POOL_SIZE: ${HIERARCHY_POSTGRES_POOL_SIZE:-10}
  HIERARCHY_POSTGRES_POOL_OVERFLOW: ${HIERARCHY_POSTGRES_POOL_OVERFLOW:-5}
  HIERARCHY_POSTGRES_CONNECT_TIMEOUT_S: ${HIERARCHY_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
  HIERARCHY_POSTGRES_STATEMENT_TIMEOUT_MS: ${HIERARCHY_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
  HIERARCHY_POSTGRES_LOCK_TIMEOUT_MS: ${HIERARCHY_POSTGRES_LOCK_TIMEOUT_MS:-3000}
  HIERARCHY_APP_NAME: hierarchy-server
  HIERARCHY_APP_ROLE: api
  HIERARCHY_APP_INSTANCE: ${HIERARCHY_APP_INSTANCE:-}
  HIERARCHY_APP_LOG_LEVEL: ${HIERARCHY_APP_LOG_LEVEL:-INFO}
  HIERARCHY_APP_LOG_FORMAT: ${HIERARCHY_APP_LOG_FORMAT:-json}
  HIERARCHY_APP_HTTP_HOST: 0.0.0.0
  HIERARCHY_APP_HTTP_PORT: 8010
  HIERARCHY_APP_DRAIN_TIMEOUT_S: ${HIERARCHY_APP_DRAIN_TIMEOUT_S:-20.0}
  HIERARCHY_APP_TRACE_SAMPLE_RATIO: ${HIERARCHY_APP_TRACE_SAMPLE_RATIO:-0.1}
  HIERARCHY_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
  HIERARCHY_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg18@sha256:0fcff5761363809d1242f2261a3482197b5a5337407f8b97a976fb174206d579
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?必填}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      POSTGRES_DB: ${POSTGRES_DB:?必填}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必填}
    command: ['sh', '-c', 'exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: digitaltwin/minio:2025.10.15-9e49d5e7
    pull_policy: build
    build:
      context: ./minio
      target: server
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:?必填}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:?必填}
    command: ['server', '/data', '--console-address', ':9001']
    ports: ['127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: digitaltwin/minio-client:2025.08.13-7394ce0d
    pull_policy: build
    build:
      context: ./minio
      target: client
    environment:
      OSS_ENDPOINT: ${OSS_ENDPOINT:?必填：对象存储地址，带 scheme}
      OSS_BUCKET: ${OSS_BUCKET:-digitaltwin}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set dt "$$OSS_ENDPOINT" "$$OSS_ACCESS_KEY" "$$OSS_SECRET_KEY"
        mc mb --ignore-existing "dt/$$OSS_BUCKET"
        for prefix in models images icons; do
          mc anonymous set download "dt/$$OSS_BUCKET/$$prefix"
        done
    depends_on:
      minio: {condition: service_healthy}
    restart: 'no'

  database-migrate:
    image: digitaltwin/database-migrate:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: deploy/Dockerfile
    environment:
      <<: [*auth-environment, *platform-environment]
      COLLECT_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      COLLECT_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      COLLECT_POSTGRES_USER: ${POSTGRES_USER:?必填}
      COLLECT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      COLLECT_POSTGRES_DB: ${POSTGRES_DB:?必填}
      COLLECT_POSTGRES_SCHEMA: collect
      COLLECT_POSTGRES_POOL_SIZE: ${COLLECT_POSTGRES_POOL_SIZE:-10}
      COLLECT_POSTGRES_POOL_OVERFLOW: ${COLLECT_POSTGRES_POOL_OVERFLOW:-5}
      COLLECT_POSTGRES_CONNECT_TIMEOUT_S: ${COLLECT_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
      COLLECT_POSTGRES_STATEMENT_TIMEOUT_MS: ${COLLECT_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
      COLLECT_POSTGRES_LOCK_TIMEOUT_MS: ${COLLECT_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      OPCUA_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      OPCUA_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OPCUA_POSTGRES_USER: ${POSTGRES_USER:?必填}
      OPCUA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      OPCUA_POSTGRES_DB: ${POSTGRES_DB:?必填}
      OPCUA_POSTGRES_SCHEMA: opcua
      OPCUA_POSTGRES_POOL_SIZE: ${OPCUA_POSTGRES_POOL_SIZE:-10}
      OPCUA_POSTGRES_POOL_OVERFLOW: ${OPCUA_POSTGRES_POOL_OVERFLOW:-5}
      OPCUA_POSTGRES_CONNECT_TIMEOUT_S: ${OPCUA_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
      OPCUA_POSTGRES_STATEMENT_TIMEOUT_MS: ${OPCUA_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
      OPCUA_POSTGRES_LOCK_TIMEOUT_MS: ${OPCUA_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      REALTIME_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      REALTIME_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_POSTGRES_USER: ${POSTGRES_USER:?必填}
      REALTIME_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      REALTIME_POSTGRES_DB: ${POSTGRES_DB:?必填}
      REALTIME_POSTGRES_SCHEMA: realtime
      REALTIME_POSTGRES_POOL_SIZE: ${REALTIME_POSTGRES_POOL_SIZE:-10}
      REALTIME_POSTGRES_POOL_OVERFLOW: ${REALTIME_POSTGRES_POOL_OVERFLOW:-5}
      REALTIME_POSTGRES_CONNECT_TIMEOUT_S: ${REALTIME_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
      REALTIME_POSTGRES_STATEMENT_TIMEOUT_MS: ${REALTIME_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
      REALTIME_POSTGRES_LOCK_TIMEOUT_MS: ${REALTIME_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      HIERARCHY_POSTGRES_SCHEMA: hierarchy
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:?必填}
      AUTH_SEED_ADMIN_USERNAME: ${AUTH_SEED_ADMIN_USERNAME:-admin}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@example.com}
      POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${MIGRATION_POSTGRES_USER:-${POSTGRES_USER:?必填}}
      POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?必填}}
      POSTGRES_DB: ${POSTGRES_DB:?必填}
      MIGRATION_DATABASE_WAIT_TIMEOUT_S: ${MIGRATION_DATABASE_WAIT_TIMEOUT_S:-120}
      MIGRATION_COMMAND_TIMEOUT_S: ${MIGRATION_COMMAND_TIMEOUT_S:-600}
    command:
      - --service
      - auth-server
      - --service
      - platform-server
      - --service
      - opcua-server
      - --service
      - collector-server
      - --service
      - realtime-hub
      - --service
      - hierarchy-server
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: 'no'

  auth-server:
    image: digitaltwin/auth-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: services/auth-server/Dockerfile
    # ⚠ 等迁移与种子跑完再起：权限码目录是代码里的真源，先起服务后灌种子的话，
    # 中间那段窗口里新端点一律 403，而两边代码单看都对
    depends_on:
      database-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *auth-environment
      AUTH_APP_ROLE: api
    expose: ['8004']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/api/v1/auth/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  platform-server:
    image: digitaltwin/platform-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build: &platform-build
      context: ../server
      dockerfile: services/platform-server/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: api
    expose: ['8005']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/api/v1/platform/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  platform-worker:
    image: digitaltwin/platform-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build: *platform-build
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: worker
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  platform-publisher:
    image: digitaltwin/platform-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build: *platform-build
    depends_on:
      realtime-hub: {condition: service_started}
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: publisher
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  collector-server:
    image: digitaltwin/collector-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: services/collector-server/Dockerfile
    depends_on:
      platform-server: {condition: service_started}
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *collect-environment
      COLLECT_APP_ROLE: collector
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8007/api/v1/collector/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  opcua-server:
    image: digitaltwin/opcua-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: services/opcua-server/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *opcua-environment
      OPCUA_APP_ROLE: api
    expose: ['8008']
    ports:
      - '${OPCUA_PORT_POOL:-4840-4859}:${OPCUA_PORT_POOL:-4840-4859}'
    volumes:
      # 服务器私钥只在这个卷上——不进镜像层、不进数据库、不随备份外流。
      # 卷没了等于全部实例的证书没了，上位机需要重新信任新证书。
      - opcua-pki:/var/lib/opcua/pki
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/api/v1/opcua/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  realtime-hub:
    image: digitaltwin/realtime-hub:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: services/realtime-hub/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *realtime-hub-environment
      REALTIME_APP_ROLE: hub
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/realtime/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  hierarchy-server:
    profiles: ['hierarchy']
    image: digitaltwin/hierarchy-server:${IMAGE_TAG:?必填：版本号-提交SHA}
    build:
      context: ../server
      dockerfile: services/hierarchy-server/Dockerfile
    environment:
      <<: *hierarchy-environment
    expose: ['8010']
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/api/v1/hierarchy/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: *stop-grace-period
    restart: unless-stopped

  edge-gateway:
    image: digitaltwin/web-no-ai:${IMAGE_TAG:?必填：版本号-提交SHA}
    ports: ['${EDGE_HTTP_PORT:-8080}:80']
    environment:
      AUTH_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      OSS_BUCKET: ${OSS_BUCKET:-digitaltwin}
      OSS_UPSTREAM: ${OSS_UPSTREAM:?必填：host:port，不带协议}
      NGINX_ENVSUBST_FILTER: '^(AUTH_|OSS_)'
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_AI_ENABLED: 'false'
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      auth-server: {condition: service_healthy}
      platform-server: {condition: service_healthy}
      opcua-server: {condition: service_started}
      realtime-hub: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ./nginx/auth-inject.conf:/etc/nginx/conf.d/auth-inject.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/auth/health']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opcua-pki:
