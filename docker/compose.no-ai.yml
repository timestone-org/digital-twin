# 完整的非 AI 单机编排，内置 PostgreSQL / TimescaleDB、MinIO、Redis。
# 配置来源为 no-ai.env.example；不依赖 compose.yml，不包含助手或知识库运行角色。
name: digitaltwin-no-ai

# 关停宽限：Docker 缺省 10s 就强杀，会抢在 drain（APP_DRAIN_TIMEOUT_S 缺省 20s，
# knowledge-worker 写死 30s）前面，排在最后的归档 flush 与让租约都跑不到。
# ⚠ 调大任何一个 *_APP_DRAIN_TIMEOUT_S 时这里要跟着调（runtime-resilience §8）
x-stop-grace-period: &stop-grace-period 45s

