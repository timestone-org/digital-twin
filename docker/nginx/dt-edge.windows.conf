# DigitalTwin 边缘网关 —— 整段 include 进任意一个 nginx 的 `http { }` 即可，
# 与同一台机器上别的站点共存。
#
# 用法（conf\sites-enabled\ 那种多站点布局）：
#   1. 本文件拷成 conf\sites-enabled\platform-82.conf（名字随意）
#   2. proxy-common.conf 与 auth-inject.conf 拷进 conf\ **根目录**
#   3. 主配置的 http 块里有一行 `include sites-enabled/*.conf;` 之类的即可
#
# ⚠ **两份 include 必须放在主配置文件所在的那个目录**（这里是 conf\），不是跟
# 本文件放一起。nginx 的 include 相对路径按 conf_prefix 解析——也就是主配置
# nginx.conf 所在的目录——哪怕 include 写在被包含的子文件里也一样。放错的报错是：
#   CreateFile() "D:\nginx/conf/proxy-common.conf" failed (2: ...)
# 想跟本文件放一起就得写成 `include sites-enabled/proxy-common.conf;`。
#
# ⚠ **必须 include 在 `http { }` 里面**：map 与 limit_req_zone 只在 http 级合法。
# 放到 http 外或塞进某个 server 块的报错是 `"map" directive is not allowed here`。
#
# ⚠ 变量名与限流区名一律带 `dt_` 前缀。共用一个 nginx 时，`$connection_upgrade`
# 或 `zone=login` 这种通名一旦与别的站点重名就是 `duplicate ...`，而后果是
# **整个 nginx 起不来**——别的站点跟着一起没。
#
# ⚠ 权威模板是 docker/nginx/nginx.conf.template（容器那份）：那边改了这边要
# 同步，差异清单见 docs/DEPLOY_WINDOWS_NSSM.md §8.1。
#
# 随部署走的三处：`listen`（端口）、`root`（前端 dist 的绝对路径，**正斜杠**）、
# `X-Service-Key`（auth 的 AUTH_EDGE_SERVICE_KEY，逐字相同）。
# ⚠ 仓库里 X-Service-Key 是占位符，**不许把真值提交回来**。

# 公开面是可枚举凭据的爆破面，必须限流
limit_req_zone $binary_remote_addr zone=dt_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dt_public_dashboard:10m rate=60r/m;
# 模型对外推理面免认证，且一次调用可能算上百行，闸要更严
limit_req_zone $binary_remote_addr zone=dt_open_model:10m rate=120r/m;

map $http_upgrade $dt_connection_upgrade {
  default upgrade;
  ''      close;
}

# 语音输入的 WS：token 在子协议里，映射成 Authorization 交给 /_auth_ws 去验。
# ⚠ 只认「dt.auth, <token>」这个固定形状
map $http_sec_websocket_protocol $dt_ws_bearer {
  default "";
  "~^dt\.auth,\s*(?<dt_ws_token>[^,\s]+)$" "Bearer $dt_ws_token";
}

# 上游一律本机回环。⚠ 取值是 IP 字面量，故不需要 resolver
map $host $dt_auth_upstream      { default '127.0.0.1:8004'; }
map $host $dt_platform_upstream  { default '127.0.0.1:8005'; }
map $host $dt_opcua_upstream     { default '127.0.0.1:8008'; }
map $host $dt_realtime_upstream  { default '127.0.0.1:8000'; }
map $host $dt_assistant_upstream { default '127.0.0.1:8006'; }
# 知识库。⚠ 与助手同档可缺席：没起 knowledge-server 时这几条 location 会 502，
# 而前端的能力探测把 502 读成「这套部署没有知识库」，入口于是干净地不出现
map $host $dt_knowledge_upstream { default '127.0.0.1:8009'; }
map $host $dt_oss_upstream       { default '127.0.0.1:9000'; }

# ⚠ 子请求里 $uri 是子请求自己的 /_auth，拿它去问规则表一律 no_matching_rule
# → 全站 403；只有 $request_uri 继承父请求。但它带查询串，而规则是对 path 做
# fnmatch，故在这里剥掉查询串。
map $request_uri $dt_original_path {
  default              $request_uri;
  "~^(?<dt_path_only>[^?]*)\?" $dt_path_only;
}

server {
  # 唯一要改的一行：对外端口
  listen 82;

  # /verify 的响应头里带 base64 权限集，默认 4k 的缓冲会截断它，表现是登录之后
  # 受管接口一律 502。⚠ 写在 server 级而不是 http 级：与同一个 nginx 上别的
  # 站点互不影响
  proxy_buffer_size 8k;
  proxy_buffers     8 8k;

  # ⚠ 不引用 log_format：共用 nginx 时格式名很容易撞（duplicate log_format），
  # 而那会让整个 nginx 起不来。要带 trace 的 JSON 日志就在主配置里定义好格式，
  # 再把这一行改成 `access_log logs/dt-access.log <格式名>;`
  access_log logs/dt-access.log;

  # ⚠ 客户端伪造这几个头就等于伪造身份，server 级先一律置空
  proxy_set_header X-Auth-User-Id   "";
  proxy_set_header X-Auth-Username  "";
  proxy_set_header X-Auth-Role      "";
  proxy_set_header X-Auth-Permissions "";
  proxy_set_header X-Auth-Permissions-Truncated "";
  proxy_set_header X-Auth-Exp       "";
  proxy_set_header X-Auth-Sig       "";

  location ^~ /internal/ { deny all; }

  # —— 免认证 location ——
  # ⚠ 规则表里的空 permission_codes 是「任意已登录用户」，不是匿名放行。
  # 匿名可达性只由这几条保证；删掉任何一条都会导致全站无法登录。
  location = /api/v1/auth/sessions {
    limit_req zone=dt_login burst=5 nodelay;
    proxy_pass http://$dt_auth_upstream$request_uri;
    include proxy-common.conf;
  }
  location = /api/v1/auth/sessions:refresh {
    proxy_pass http://$dt_auth_upstream$request_uri;
    include proxy-common.conf;
  }
  location = /api/v1/auth/sessions:revoke {
    proxy_pass http://$dt_auth_upstream$request_uri;
    include proxy-common.conf;
  }
  location = /api/v1/auth/registrations {
    limit_req zone=dt_login burst=3 nodelay;
    proxy_pass http://$dt_auth_upstream$request_uri;
    include proxy-common.conf;
  }
  location = /api/v1/auth/health { proxy_pass http://$dt_auth_upstream$request_uri; }
  location = /api/v1/auth/ready  { proxy_pass http://$dt_auth_upstream$request_uri; }
  location = /api/v1/auth/docs   { proxy_pass http://$dt_auth_upstream$request_uri; }
  location = /api/v1/auth/redoc  { proxy_pass http://$dt_auth_upstream$request_uri; }
  location = /api/v1/auth/openapi.json { proxy_pass http://$dt_auth_upstream$request_uri; }

  location = /api/v1/platform/health { proxy_pass http://$dt_platform_upstream$request_uri; }
  location = /api/v1/platform/ready  { proxy_pass http://$dt_platform_upstream$request_uri; }
  location = /api/v1/platform/docs   { proxy_pass http://$dt_platform_upstream$request_uri; }
  location = /api/v1/platform/redoc  { proxy_pass http://$dt_platform_upstream$request_uri; }
  location = /api/v1/platform/openapi.json {
    proxy_pass http://$dt_platform_upstream$request_uri;
  }

  # 公开大屏。⚠ 免认证是刻意的：链接持有者就是未登录访客，挂上 auth_request
  # 会让每个公开链接一律 401。`^~` 不能省。
  location ^~ /api/v1/platform/public-dashboards/ {
    limit_req zone=dt_public_dashboard burst=20 nodelay;
    proxy_pass http://$dt_platform_upstream$request_uri;
    include proxy-common.conf;
  }

  # 模型对外推理面。⚠ 免认证是刻意的：调用方是第三方系统，持的是 API 密钥
  # 不是会话，挂上 auth_request 一律 401。密钥由 platform 自己核对。
  # ⚠ 这一层按来源 IP 限，platform 那一层按密钥限；缺一层就绕得过去。
  location ^~ /api/v1/platform/open-models/ {
    limit_req zone=dt_open_model burst=40 nodelay;
    client_max_body_size 256k;
    proxy_pass http://$dt_platform_upstream$request_uri;
    include proxy-common.conf;
  }

  # 素材字节。⚠ 免认证是刻意的：大屏机要像取静态资源一样匿名取模型与图片，
  # 而桶里只有三个已验证的前缀匿名可读（staging/ 不在列）。
  location ^~ /oss/ {
    # 桶名不出现在对外地址里：换桶只改这一行，存量 asset: 引用不受影响
    rewrite ^/oss/(.*)$ /digitaltwin/$1 break;
    # ⚠ 这里是 $uri 不是 $request_uri：上一行 rewrite 刚改写过路径
    proxy_pass http://$dt_oss_upstream$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # ⚠ 刻意不 include proxy-common.conf：那份的 25s 读超时对 200MB 的模型
    # 上传太短，而超时切断表现成「传到一半永远卡住」
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # ⚠ 必须关掉请求缓冲：开着的话 nginx 先把整个上传落到自己的临时盘
    proxy_request_buffering off;
    client_max_body_size 512m;
  }

  # —— 受保护面 ——
  location /api/v1/auth/ {
    include auth-inject.conf;
    proxy_pass http://$dt_auth_upstream$request_uri;
    include proxy-common.conf;
  }

  # ⚠ platform 完全依赖这里注入的签名头来认人：它自己不校验令牌。
  # 这个 location 漏了 auth-inject，整个业务面就是一律 401。
  location /api/v1/platform/ {
    include auth-inject.conf;
    proxy_pass http://$dt_platform_upstream$request_uri;
    include proxy-common.conf;
  }

  location = /api/v1/opcua/health { proxy_pass http://$dt_opcua_upstream$request_uri; }
  location = /api/v1/opcua/ready  { proxy_pass http://$dt_opcua_upstream$request_uri; }
  location = /api/v1/opcua/docs   { proxy_pass http://$dt_opcua_upstream$request_uri; }
  location = /api/v1/opcua/redoc  { proxy_pass http://$dt_opcua_upstream$request_uri; }
  location = /api/v1/opcua/openapi.json { proxy_pass http://$dt_opcua_upstream$request_uri; }

  # ⚠ 这一片与模板一样逐条写开（而不是 include auth-inject.conf）：
  # 保持与 docker/nginx/nginx.conf.template 逐行可比，同步时一眼看得出差异
  location /api/v1/opcua/ {
    auth_request /_auth;
    auth_request_set $dt_opcua_user  $upstream_http_x_auth_user_id;
    auth_request_set $dt_opcua_name  $upstream_http_x_auth_username;
    auth_request_set $dt_opcua_role  $upstream_http_x_auth_role;
    auth_request_set $dt_opcua_perms $upstream_http_x_auth_permissions;
    auth_request_set $dt_opcua_trunc $upstream_http_x_auth_permissions_truncated;
    auth_request_set $dt_opcua_exp   $upstream_http_x_auth_exp;
    auth_request_set $dt_opcua_sig   $upstream_http_x_auth_sig;

    proxy_set_header X-Auth-User-Id   $dt_opcua_user;
    proxy_set_header X-Auth-Username  $dt_opcua_name;
    proxy_set_header X-Auth-Role      $dt_opcua_role;
    proxy_set_header X-Auth-Permissions $dt_opcua_perms;
    proxy_set_header X-Auth-Permissions-Truncated $dt_opcua_trunc;
    proxy_set_header X-Auth-Exp       $dt_opcua_exp;
    proxy_set_header X-Auth-Sig       $dt_opcua_sig;

    proxy_pass http://$dt_opcua_upstream$request_uri;
    include proxy-common.conf;
  }

  # —— 实时通道 ——
  location = /api/v1/realtime/health { proxy_pass http://$dt_realtime_upstream$request_uri; }
  location = /api/v1/realtime/ready  { proxy_pass http://$dt_realtime_upstream$request_uri; }
  location = /api/v1/realtime/docs   { proxy_pass http://$dt_realtime_upstream$request_uri; }
  location = /api/v1/realtime/redoc  { proxy_pass http://$dt_realtime_upstream$request_uri; }
  location = /api/v1/realtime/openapi.json { proxy_pass http://$dt_realtime_upstream$request_uri; }

  # ⚠ 免认证是刻意的：token 走 Sec-WebSocket-Protocol 子协议，auth_request 的
  # 子请求带不上它，挂上去的结果是所有握手一律 401。认证在 hub 内部完成。
  location = /api/v1/realtime/ws {
    proxy_pass http://$dt_realtime_upstream$request_uri;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent       $http_traceparent;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # ⚠ 这两行缺一条，握手就退化成普通 HTTP，客户端收到 400/426
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $dt_connection_upgrade;
    # ⚠ 用共用的 25s 会让**每条空闲 25 秒的连接被切断**，表现是「前端每隔
    # 半分钟重连一次」，查起来会一路怀疑到应用层
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # —— AI 助手 ——
  location = /api/v1/assistant/health { proxy_pass http://$dt_assistant_upstream$request_uri; }
  location = /api/v1/assistant/ready  { proxy_pass http://$dt_assistant_upstream$request_uri; }
  location = /api/v1/assistant/docs   { proxy_pass http://$dt_assistant_upstream$request_uri; }
  location = /api/v1/assistant/redoc  { proxy_pass http://$dt_assistant_upstream$request_uri; }
  location = /api/v1/assistant/openapi.json {
    proxy_pass http://$dt_assistant_upstream$request_uri;
  }

  # 推进一个回合：事件流，一条请求开着几十秒逐步往外吐
  location ~ ^/api/v1/assistant/sessions/[^/]+:advance$ {
    include auth-inject.conf;
    proxy_pass http://$dt_assistant_upstream$request_uri;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent       $http_traceparent;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # ⚠ 要比 ASSISTANT_MODEL_TIMEOUT_S 大，否则边缘先掐
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # ⚠ 这两行缺一条，事件流就退化成「攒完再一次吐出来」
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    client_max_body_size 8m;
  }

  location /api/v1/assistant/ {
    include auth-inject.conf;
    proxy_pass http://$dt_assistant_upstream$request_uri;
    include proxy-common.conf;
    client_max_body_size 8m;
  }

  # —— 知识库 ——
  location = /api/v1/knowledge/health { proxy_pass http://$dt_knowledge_upstream$request_uri; }
  location = /api/v1/knowledge/ready  { proxy_pass http://$dt_knowledge_upstream$request_uri; }
  location = /api/v1/knowledge/docs   { proxy_pass http://$dt_knowledge_upstream$request_uri; }
  location = /api/v1/knowledge/redoc  { proxy_pass http://$dt_knowledge_upstream$request_uri; }
  location = /api/v1/knowledge/openapi.json {
    proxy_pass http://$dt_knowledge_upstream$request_uri;
  }

  # 语音输入的 WebSocket（ADR-0038）。⚠ 与 realtime 那条不同，这里挂 auth_request：
  # token 走子协议，由 /_auth_ws 映射成 Authorization 去验，再注入签名身份头。
  # ⚠ 精确匹配压过下面的正则与前缀；不 include auth-inject.conf（它的
  # `auth_request /_auth;` 会覆盖成没有 Authorization 的那条），头逐条写全
  location = /api/v1/knowledge/speech/ws {
    auth_request /_auth_ws;
    auth_request_set $dt_speech_user  $upstream_http_x_auth_user_id;
    auth_request_set $dt_speech_name  $upstream_http_x_auth_username;
    auth_request_set $dt_speech_role  $upstream_http_x_auth_role;
    auth_request_set $dt_speech_perms $upstream_http_x_auth_permissions;
    auth_request_set $dt_speech_trunc $upstream_http_x_auth_permissions_truncated;
    auth_request_set $dt_speech_exp   $upstream_http_x_auth_exp;
    auth_request_set $dt_speech_sig   $upstream_http_x_auth_sig;

    proxy_set_header X-Auth-User-Id   $dt_speech_user;
    proxy_set_header X-Auth-Username  $dt_speech_name;
    proxy_set_header X-Auth-Role      $dt_speech_role;
    proxy_set_header X-Auth-Permissions $dt_speech_perms;
    proxy_set_header X-Auth-Permissions-Truncated $dt_speech_trunc;
    proxy_set_header X-Auth-Exp       $dt_speech_exp;
    proxy_set_header X-Auth-Sig       $dt_speech_sig;

    proxy_pass http://$dt_knowledge_upstream$request_uri;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent       $http_traceparent;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # ⚠ 这两行缺一条，握手就退化成普通 HTTP，客户端收到 400/426
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $dt_connection_upgrade;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  # 知识库对话的推进：事件流，与助手那条同一口径
  location ~ ^/api/v1/knowledge/chat-sessions/[^/]+:advance$ {
    include auth-inject.conf;
    proxy_pass http://$dt_knowledge_upstream$request_uri;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent       $http_traceparent;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    # ⚠ 要比 ASSISTANT_MODEL_TIMEOUT_S 大，否则边缘先掐
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # ⚠ 这两行缺一条，事件流就退化成「攒完再一次吐出来」
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    client_max_body_size 8m;
  }

  location /api/v1/knowledge/ {
    include auth-inject.conf;
    proxy_pass http://$dt_knowledge_upstream$request_uri;
    include proxy-common.conf;
    # ⚠ 文档原件不走这条：浏览器直传对象存储，边缘只过签名与元数据
    client_max_body_size 8m;
  }

  # 鉴权子请求。⚠ auth_request 只能发 GET，故 /verify 是 GET。
  location = /_auth {
    internal;
    proxy_pass http://$dt_auth_upstream/internal/v1/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI    $dt_original_path;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Service-Key     "<AUTH_EDGE_SERVICE_KEY>";
    # 全站前置，每个受保护请求过一次，必须快；超时按拒绝处理
    proxy_connect_timeout 500ms;
    proxy_read_timeout    500ms;
  }

  # 语音输入 WS 的鉴权子请求：与 /_auth 逐行相同，只多一行 Authorization。
  # ⚠ 不能复用 /_auth：浏览器的 WebSocket 构造器没有地方放 Authorization 头
  location = /_auth_ws {
    internal;
    proxy_pass http://$dt_auth_upstream/internal/v1/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization     $dt_ws_bearer;
    # 子请求是普通 GET，不把父请求的 Upgrade 带给 auth-server
    proxy_set_header Upgrade           "";
    proxy_set_header X-Original-URI    $dt_original_path;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Service-Key     "<AUTH_EDGE_SERVICE_KEY>";
    proxy_connect_timeout 500ms;
    proxy_read_timeout    500ms;
  }

  location / {
    root D:/AI/DigitalTwin/web/app/dist;
    # ⚠ 刻意不试 $uri/：产物里有真实的 assets/ 目录，而前端也有一条 /assets
    # 路由。试目录会先 301 再 403——直接输地址与刷新都进不去，而站内点导航
    # 却是好的，于是看着像「只有刷新会坏」
    try_files $uri /index.html;
  }
}
