# DigitalTwin edge-gateway —— Windows 原生 nginx 的**独立部署**外壳。
#
# 这份只有进程与 http 的公共设置，站点本身全在 dt-edge.windows.conf 里。
# 拆成两份是因为它们的去处不同：这一份只在「这台 nginx 专门给 DigitalTwin 用」
# 时才拷；与别的站点共用一台 nginx 时**只拷 dt-edge.windows.conf**，
# 整段 include 进对方的 http 块（用法见那份文件的开头）。
#
# 用法（独立部署）：
#   1. 本文件拷成 <nginx 根>\conf\nginx.conf
#   2. dt-edge.windows.conf、proxy-common.conf、auth-inject.conf 一起拷进 conf\
#   3. nginx.exe -t -p <nginx 根>
#
# ⚠ 落盘必须是**无 BOM 的 UTF-8**：nginx 把 BOM 当成指令的一部分，
# 报的是 `unknown directive`，而那个字符在编辑器里看不见。
#
# ⚠ 权威模板是 docker/nginx/nginx.conf.template（容器那份）：那边改了这边要
# 同步，差异清单见 docs/DEPLOY_WINDOWS_NSSM.md §8.1。

# ⚠ nginx/Windows 起多个 worker 也只有一个真干活，不必调大
worker_processes 1;

# ⚠ 前台运行：nssm 靠「进程活着」判断服务状态。nginx 默认自我 daemon 化，
# 那样 nssm 会在启动后立刻看到进程退出，于是无限重启
daemon off;

events {
  # ⚠ nginx/Windows 只有 select()/poll()，上限受 FD_SETSIZE(1024) 限制。
  # 调大不会生效，反而会在启动时告警
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # ⚠ 格式名带 dt_ 前缀：万一以后这台 nginx 还要发别的站点，通名会撞
  log_format dt_json escape=json '{"ts":"$time_iso8601","status":$status,'
    '"method":"$request_method","uri":"$uri","rt":$request_time,'
    '"trace":"$http_traceparent"}';
  access_log logs/access.log dt_json;
  error_log  logs/error.log warn;

  # 站点本身。⚠ 里面那条 server 级 access_log 会盖掉上面这条；想让本站也走
  # JSON，就把 dt-edge.windows.conf 里那一行改成 `access_log logs/dt-access.log dt_json;`
  include dt-edge.windows.conf;
}
