      PLATFORM_COLLECT_CREDENTIAL_SECRET: ${COLLECT_CREDENTIAL_SECRET:?必填}
      # 模型供应商目录的加密密钥（ADR-0039）。⚠ 留空即目录整个缺席：模型管理页
      # 回 503，助手与知识库退回各自环境变量那一档——不是启动失败
      PLATFORM_LLM_PROVIDER_SECRET: ${LLM_PROVIDER_SECRET:-}
      # ⚠ 8008 不是 8000——8000 是 realtime-hub 的
      PLATFORM_OPCUA_BASE_URL: http://opcua-server:8008
      # 采集计划变更的广播频道，collector 订阅同一个
      PLATFORM_COLLECT_PLAN_CHANNEL: ${COLLECT_PLAN_CHANNEL:-collect:plan:changed}
      PLATFORM_COLLECT_BUCKET_TIMEZONE: ${COLLECT_BUCKET_TIMEZONE:-Asia/Shanghai}
      # 台账按日历回推月/年窗口时用的业务时区，同时也是聚合采集器的分桶时区。
      # ⚠ **三个角色必须同值**：api 按一种边界算公式窗口、worker 按另一种分桶，
      # 行会成批落进隔壁那一格，而数值本身合法、全程不报错
      PLATFORM_DATASET_BUCKET_TIMEZONE: ${DATASET_BUCKET_TIMEZONE:-Asia/Shanghai}
      # 抽取分片队列。api 角色只投递，worker 角色消费
      PLATFORM_REDIS_HOST: ${REDIS_HOST:?必填}
      PLATFORM_REDIS_PORT: ${REDIS_PORT:-6379}
      PLATFORM_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PLATFORM_ACSTARTUP_STREAM: ${ACSTARTUP_STREAM:-platform:ac-startup:shards}
      PLATFORM_ACSTARTUP_GROUP: ${ACSTARTUP_GROUP:-ac-startup-workers}
      # 素材字节面。⚠ 凭据与对象存储自己的 root 凭据同源，两边必须一致：
      # 分叉的表现是直传凭证签得出来、浏览器一传就 403，而两边的配置单看都对
      PLATFORM_OBJECTSTORE_ENDPOINT: ${OSS_ENDPOINT:?必填}
      PLATFORM_OBJECTSTORE_BUCKET: ${OSS_BUCKET:-digitaltwin}
      PLATFORM_OBJECTSTORE_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      PLATFORM_OBJECTSTORE_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
      # 浏览器侧的直传落点，由边缘反代到桶根
      PLATFORM_OBJECTSTORE_PUBLIC_BASE: ${OSS_PUBLIC_BASE:-/oss/}
    expose: ['8005']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/api/v1/platform/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # AI 助手。⚠ 它是**可缺席**的：没有它，前端探测失败之后入口干净地不出现，
  # 别的功能一件不少（features/ai/ports.ts）。所以边缘不给它挂 service_healthy，
  # 它起不来也不该拖着整个站不启动。
  # ⚠ 没配 ASSISTANT_MODEL_API_KEY 时服务照常起，只是能力面回「没接模型」——
  # 密钥类绝不给默认值，而弱默认的密钥等于没有密钥（config-and-secrets §2）。
  ai-assistant:
    build:
      context: ../server
      dockerfile: services/ai-assistant/Dockerfile
    depends_on:
      assistant-migrate: {condition: service_completed_successfully}
    environment:
      ASSISTANT_APP_ROLE: api
      ASSISTANT_APP_LOG_FORMAT: json
      ASSISTANT_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      ASSISTANT_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ASSISTANT_POSTGRES_USER: ${POSTGRES_USER:?必填}
      ASSISTANT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      ASSISTANT_POSTGRES_DB: ${POSTGRES_DB:?必填}
      ASSISTANT_POSTGRES_SCHEMA: assistant
      ASSISTANT_REDIS_HOST: ${REDIS_HOST:?必填}
      ASSISTANT_REDIS_PORT: ${REDIS_PORT:-6379}
      ASSISTANT_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 取同一个值：分叉就是助手一律 401
      ASSISTANT_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      ASSISTANT_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      # 助手代表用户去读点位与模块清单，故上游是业务面自己
      ASSISTANT_PLATFORM_BASE_URL: http://platform-server:8005
      # ⚠ 续签委托身份用：边缘签的身份头只有几十秒，而一个回合能跑几分钟。
      # 这一格指错的现象是「回合后半段每个工具都报 platform 回了 401」
      ASSISTANT_AUTH_BASE_URL: http://auth-server:8004
      # 知识库读侧。⚠ 留空即助手侧「查知识库」那两个工具报「这套部署没接
      # 知识库」；不留空但服务没起时是另一回事——那时如实报「暂时不可用」
      ASSISTANT_KNOWLEDGE_BASE_URL: ${ASSISTANT_KNOWLEDGE_BASE_URL:-http://knowledge-server:8009}
      # 模型。⚠ 开关开着却没配密钥 = 启动即失败，而不是起来之后每次对话报错
      ASSISTANT_MODEL_ENABLED: ${ASSISTANT_MODEL_ENABLED:-false}
      ASSISTANT_MODEL_BASE_URL: ${ASSISTANT_MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ASSISTANT_MODEL_API_KEY: ${ASSISTANT_MODEL_API_KEY:-}
      ASSISTANT_MODEL_CHAT: ${ASSISTANT_MODEL_CHAT:-qwen3.8-max}
      ASSISTANT_MODEL_VISION: ${ASSISTANT_MODEL_VISION:-qwen3.8-max}
      ASSISTANT_MODEL_TIMEOUT_S: ${ASSISTANT_MODEL_TIMEOUT_S:-120}
      # 逐字流式。⚠ 关掉它 = 整个回合只看得见「做了哪一步」，模型说的那段话要等
      # 回合结束才整段出现。留成配置只为一种场合：个别 OpenAI 兼容端点带工具时
      # 不支持流式，那时表现是一条 400
      ASSISTANT_MODEL_STREAM_ENABLED: ${ASSISTANT_MODEL_STREAM_ENABLED:-true}
      # 透传给端点的额外请求体，一段 JSON 对象。思考开关一类的键各家不同，
      # 而代码里不认厂商名——于是它只能是取值。留空即什么都不加
      ASSISTANT_MODEL_EXTRA_BODY: ${ASSISTANT_MODEL_EXTRA_BODY:-}
      # 第二条模型来路：ChatGPT 订阅直连 Codex（ADR-0026）。与上面那条**并存**，
      # 由每个会话自己选走哪一路。默认关。
      # ⚠ 这几格必须逐个写在这里：compose 不给服务挂 env_file，宿主 .env 里配了
      # 而这里没列的变量**根本进不了容器**——表现是页面上这一路始终「未启用」，
      # 而 .env 单看是配好的，两边都不报错
      ASSISTANT_CODEX_ENABLED: ${ASSISTANT_CODEX_ENABLED:-false}
      # ⚠ 开关为真时这两格必填，否则**启动即失败**（刻意的）：没配模型代号是每次
      # 对话撞一条 404，没配加密密钥是「登录成功了但令牌存不进去」——
      # 两种现象都指不回这里
      ASSISTANT_CODEX_MODEL: ${ASSISTANT_CODEX_MODEL:-}
      ASSISTANT_CREDENTIAL_SECRET: ${ASSISTANT_CREDENTIAL_SECRET:-}
      # 面板上还能选哪几个，逗号分隔；留空就只有上面那一个
      ASSISTANT_CODEX_MODELS: ${ASSISTANT_CODEX_MODELS:-}
      # 缺省推理档位，闭合集合 low/medium/high/xhigh。⚠ 配错了不许起——
      # 端点对不认识的档位回 400，而那条 400 里不会提到是哪一格配错了
      ASSISTANT_CODEX_REASONING_EFFORT: ${ASSISTANT_CODEX_REASONING_EFFORT:-medium}
    expose: ['8006']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/api/v1/assistant/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  knowledge-server:
    build:
      context: ../server
      dockerfile: services/knowledge-server/Dockerfile
    depends_on:
      knowledge-migrate: {condition: service_completed_successfully}
    environment:
      KNOWLEDGE_APP_ROLE: api
      KNOWLEDGE_APP_LOG_FORMAT: json
      KNOWLEDGE_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      KNOWLEDGE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      KNOWLEDGE_POSTGRES_USER: ${POSTGRES_USER:?必填}
      KNOWLEDGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      KNOWLEDGE_POSTGRES_DB: ${POSTGRES_DB:?必填}
      KNOWLEDGE_POSTGRES_SCHEMA: knowledge
      KNOWLEDGE_REDIS_HOST: ${REDIS_HOST:?必填}
      KNOWLEDGE_REDIS_PORT: ${REDIS_PORT:-6379}
      KNOWLEDGE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 取同一个值：分叉就是知识库一律 401
      KNOWLEDGE_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      KNOWLEDGE_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      # 外部系统来源经业务面取数，**不读别人的库**
      KNOWLEDGE_PLATFORM_BASE_URL: http://platform-server:8005
      # ⚠ 两个角色共用一份 Settings，故对象存储这四项**每个角色都要给全**，
      # 哪怕本角色一个字节都不读：启动即全量校验，少给一处就是这个角色起不来，
      # 而现象是「检索面好好的，传上去的文档一直不动」
      KNOWLEDGE_OBJECTSTORE_ENDPOINT: ${OSS_ENDPOINT:?必填}
      KNOWLEDGE_OBJECTSTORE_BUCKET: ${OSS_BUCKET:-digitaltwin}
      KNOWLEDGE_OBJECTSTORE_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      KNOWLEDGE_OBJECTSTORE_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
      KNOWLEDGE_OBJECTSTORE_PUBLIC_BASE: ${OSS_PUBLIC_BASE:-/oss/}
      # 嵌入档。⚠ 开关开着却没配密钥 = 启动即失败，而不是起来之后每次摄取报错
      KNOWLEDGE_EMBEDDING_ENABLED: ${KNOWLEDGE_EMBEDDING_ENABLED:-false}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}
      # 对话档：只决定 agentic 检索策略可不可用
      KNOWLEDGE_MODEL_ENABLED: ${KNOWLEDGE_MODEL_ENABLED:-false}
      KNOWLEDGE_MODEL_BASE_URL: ${KNOWLEDGE_MODEL_BASE_URL:-}
      KNOWLEDGE_MODEL_API_KEY: ${KNOWLEDGE_MODEL_API_KEY:-}
      KNOWLEDGE_MODEL_CHAT: ${KNOWLEDGE_MODEL_CHAT:-}
      KNOWLEDGE_MODEL_BREAKER_FAILURES: ${KNOWLEDGE_MODEL_BREAKER_FAILURES:-5}
      KNOWLEDGE_MODEL_BREAKER_RESET_S: ${KNOWLEDGE_MODEL_BREAKER_RESET_S:-30}
      # ⚠ 与 worker 侧读的是同一对，改一处不改另一处的表现是
      # 「投得进去、没人消费」，而两边单看都对
      KNOWLEDGE_INGEST_STREAM: ${KNOWLEDGE_INGEST_STREAM:-knowledge:ingest}
      KNOWLEDGE_INGEST_GROUP: ${KNOWLEDGE_INGEST_GROUP:-knowledge-ingest-workers}
      # 索引档：auto 按探测选 / pgvector 强制加速档 / bruteforce 强制回退档。
      # ⚠ 这是**取值**不是行为——加速结构不由迁移建（ADR-0034）。要用加速档
      # 就先跑一次（两路一起开，装不上就别装，服务会自己退回回退档）：
      #   docker compose run --rm knowledge-server \
      #     python -m knowledge_server.index --enable
      KNOWLEDGE_VECTOR_INDEX: ${KNOWLEDGE_VECTOR_INDEX:-auto}
      KNOWLEDGE_KEYWORD_INDEX: ${KNOWLEDGE_KEYWORD_INDEX:-auto}
      # 语音输入：到自建 FunASR 的中继（ADR-0038）。超时那几项用代码缺省。
      # ⚠ 开关开着却没给地址 = 启动即失败，而不是第一次开麦才报错
      KNOWLEDGE_ASR_ENABLED: ${KNOWLEDGE_ASR_ENABLED:-false}
      KNOWLEDGE_ASR_URL: ${KNOWLEDGE_ASR_URL:-}
      KNOWLEDGE_ASR_HOTWORDS: ${KNOWLEDGE_ASR_HOTWORDS:-}
      # 收口前补的尾部静音：FunASR 的 VAD 靠它判「说完了」，按现场调
      KNOWLEDGE_ASR_TAIL_SILENCE_S: ${KNOWLEDGE_ASR_TAIL_SILENCE_S:-3.0}
    expose: ['8009']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/api/v1/knowledge/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # 同一份镜像的 worker 角色：解析、切块、嵌入、来源同步。
  # ⚠ **无 expose、无探针**——它不接流量，「摘掉它」没有意义；能不能干活由队列
  # 深度与日志说话。
  # ⚠ 它**可以多副本**：队列是消费组，副本之间自动分活。与 publisher 那种
  # 单活租约不是一回事。
  knowledge-worker:
    build:
      context: ../server
      dockerfile: services/knowledge-server/Dockerfile
    depends_on:
      knowledge-migrate: {condition: service_completed_successfully}
    environment:
      KNOWLEDGE_APP_ROLE: worker
      KNOWLEDGE_APP_LOG_FORMAT: json
      KNOWLEDGE_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      KNOWLEDGE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      KNOWLEDGE_POSTGRES_USER: ${POSTGRES_USER:?必填}
      KNOWLEDGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      KNOWLEDGE_POSTGRES_DB: ${POSTGRES_DB:?必填}
      KNOWLEDGE_POSTGRES_SCHEMA: knowledge
      KNOWLEDGE_REDIS_HOST: ${REDIS_HOST:?必填}
      KNOWLEDGE_REDIS_PORT: ${REDIS_PORT:-6379}
      KNOWLEDGE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 取同一个值：分叉就是知识库一律 401
      KNOWLEDGE_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      KNOWLEDGE_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      # 外部系统来源经业务面取数，**不读别人的库**
      KNOWLEDGE_PLATFORM_BASE_URL: http://platform-server:8005
      # ⚠ 两个角色共用一份 Settings，故对象存储这四项**每个角色都要给全**，
      # 哪怕本角色一个字节都不读：启动即全量校验，少给一处就是这个角色起不来，
      # 而现象是「检索面好好的，传上去的文档一直不动」
      KNOWLEDGE_OBJECTSTORE_ENDPOINT: ${OSS_ENDPOINT:?必填}
      KNOWLEDGE_OBJECTSTORE_BUCKET: ${OSS_BUCKET:-digitaltwin}
      KNOWLEDGE_OBJECTSTORE_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      KNOWLEDGE_OBJECTSTORE_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
      KNOWLEDGE_OBJECTSTORE_PUBLIC_BASE: ${OSS_PUBLIC_BASE:-/oss/}
      # 嵌入档。⚠ 开关开着却没配密钥 = 启动即失败，而不是起来之后每次摄取报错
      KNOWLEDGE_EMBEDDING_ENABLED: ${KNOWLEDGE_EMBEDDING_ENABLED:-false}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}
      # 对话档：只决定 agentic 检索策略可不可用
      KNOWLEDGE_MODEL_ENABLED: ${KNOWLEDGE_MODEL_ENABLED:-false}
      KNOWLEDGE_MODEL_BASE_URL: ${KNOWLEDGE_MODEL_BASE_URL:-}
      KNOWLEDGE_MODEL_API_KEY: ${KNOWLEDGE_MODEL_API_KEY:-}
      KNOWLEDGE_MODEL_CHAT: ${KNOWLEDGE_MODEL_CHAT:-}
      KNOWLEDGE_MODEL_BREAKER_FAILURES: ${KNOWLEDGE_MODEL_BREAKER_FAILURES:-5}
      KNOWLEDGE_MODEL_BREAKER_RESET_S: ${KNOWLEDGE_MODEL_BREAKER_RESET_S:-30}
      # ⚠ 与 worker 侧读的是同一对，改一处不改另一处的表现是
      # 「投得进去、没人消费」，而两边单看都对
      KNOWLEDGE_INGEST_STREAM: ${KNOWLEDGE_INGEST_STREAM:-knowledge:ingest}
      KNOWLEDGE_INGEST_GROUP: ${KNOWLEDGE_INGEST_GROUP:-knowledge-ingest-workers}
      # 索引档：auto 按探测选 / pgvector 强制加速档 / bruteforce 强制回退档。
      # ⚠ 这是**取值**不是行为——加速结构不由迁移建（ADR-0034）。要用加速档
      # 就先跑一次（两路一起开，装不上就别装，服务会自己退回回退档）：
      #   docker compose run --rm knowledge-server \
      #     python -m knowledge_server.index --enable
      KNOWLEDGE_VECTOR_INDEX: ${KNOWLEDGE_VECTOR_INDEX:-auto}
      KNOWLEDGE_KEYWORD_INDEX: ${KNOWLEDGE_KEYWORD_INDEX:-auto}
      # 语音输入：到自建 FunASR 的中继（ADR-0038）。超时那几项用代码缺省。
      # ⚠ 开关开着却没给地址 = 启动即失败，而不是第一次开麦才报错
      KNOWLEDGE_ASR_ENABLED: ${KNOWLEDGE_ASR_ENABLED:-false}
      KNOWLEDGE_ASR_URL: ${KNOWLEDGE_ASR_URL:-}
      KNOWLEDGE_ASR_HOTWORDS: ${KNOWLEDGE_ASR_HOTWORDS:-}
      # 收口前补的尾部静音：FunASR 的 VAD 靠它判「说完了」，按现场调
      KNOWLEDGE_ASR_TAIL_SILENCE_S: ${KNOWLEDGE_ASR_TAIL_SILENCE_S:-3.0}
    restart: unless-stopped

  # 素材字节面的建桶脚本：建桶并把三个公开前缀设成匿名可读；跑完即退出。
  # ⚠ 对象存储本身与 PostgreSQL / Redis 同档——它是**外部部署单元**，不由本编排
  # 起停（ADR-0015），故这里连的是 OSS_ENDPOINT 而不是某个服务名。它的数据目录
  # 与数据库同级纳入备份清单：素材没了，存量大屏里的每一个 asset: 引用都会变成
  # 「取不到」。
  # ⚠ `staging/` 刻意不在列：未验证的字节不许有一个本站链接。
  # ⚠ 失败即退出、不重试：桶策略配歪了要当场看见，让它悄悄重试的结果是
  # 匿名前缀没设上，而现象要等到现场大屏机取模型时才是一个 403。
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      OSS_ENDPOINT: ${OSS_ENDPOINT:?必填：对象存储地址，带 scheme}
      OSS_BUCKET: ${OSS_BUCKET:-digitaltwin}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set dt "$$OSS_ENDPOINT" "$$OSS_ACCESS_KEY" "$$OSS_SECRET_KEY"
        mc mb --ignore-existing "dt/$$OSS_BUCKET"
        for prefix in models images icons; do
          mc anonymous set download "dt/$$OSS_BUCKET/$$prefix"
        done
    restart: 'no'

  # ⚠ 与其它服务不同，这个服务**自己对外开端口**：opc.tcp 是二进制 TCP，
  # nginx 只有 http block，转不了。只有 8008 的 HTTP 管理面走边缘。
  # 端口段与 OPCUA_PORT_POOL 必须逐字一致——池外的端口没有映射出去，
  # 实例会「显示运行中但连不上」，是最难排查的一类故障（见 ADR-0006）。
  opcua-server:
    build:
      context: ../server
      dockerfile: services/opcua-server/Dockerfile
    depends_on:
      opcua-migrate: {condition: service_completed_successfully}
    environment:
      OPCUA_APP_ROLE: api
      OPCUA_APP_LOG_FORMAT: json
      OPCUA_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      OPCUA_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OPCUA_POSTGRES_USER: ${POSTGRES_USER:?必填}
      OPCUA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      OPCUA_POSTGRES_DB: ${POSTGRES_DB:?必填}
      OPCUA_POSTGRES_SCHEMA: opcua
      OPCUA_REDIS_HOST: ${REDIS_HOST:?必填}
      OPCUA_REDIS_PORT: ${REDIS_PORT:-6379}
      OPCUA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 同值。少写一处就是非对称失效：边缘签得出、这边验不了，
      # 表现为该服务一律 403，而现象与原因隔得极远。
      OPCUA_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      OPCUA_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      OPCUA_PORT_POOL: ${OPCUA_PORT_POOL:-4840-4859}
      OPCUA_MAX_INSTANCES: ${OPCUA_MAX_INSTANCES:-16}
      OPCUA_PKI_DIR: /var/lib/opcua/pki
      # 实例生灭时登记/注销主题、值变化批推都打它。
      # ⚠ 不可达时不阻断建实例——降级方向是「少一个实时通道」。
      OPCUA_REALTIME_BASE_URL: http://realtime-hub:8000
    expose: ['8008']
    ports:
      - '${OPCUA_PORT_POOL:-4840-4859}:${OPCUA_PORT_POOL:-4840-4859}'
    volumes:
      # 服务器私钥只在这个卷上——不进镜像层、不进数据库、不随备份外流。
      # 卷没了等于全部实例的证书没了，上位机需要重新信任新证书。
      - opcua-pki:/var/lib/opcua/pki
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/api/v1/opcua/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # 同一份镜像的 worker 角色：只跑抽取分片的消费循环，不监听 HTTP。
  # ⚠ 重任务永远不在 api 角色里跑（ARCHITECTURE §3.4）；扩缩靠加副本，
  # 多个 worker 共用一个消费组，各取各的分片。
  platform-worker:
    build:
      context: ../server
      dockerfile: services/platform-server/Dockerfile
    depends_on:
      platform-migrate: {condition: service_completed_successfully}
    environment:
      PLATFORM_APP_ROLE: worker
      PLATFORM_APP_LOG_FORMAT: json
      PLATFORM_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      PLATFORM_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PLATFORM_POSTGRES_USER: ${POSTGRES_USER:?必填}
      PLATFORM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      PLATFORM_POSTGRES_DB: ${POSTGRES_DB:?必填}
      PLATFORM_SQLSERVER_HOST: ${ACSOURCE_HOST:?必填：现场 EMS 库地址}
      PLATFORM_SQLSERVER_PORT: ${ACSOURCE_PORT:-1433}
      PLATFORM_SQLSERVER_USER: ${ACSOURCE_USER:?必填}
      PLATFORM_SQLSERVER_PASSWORD: ${ACSOURCE_PASSWORD:?必填}
      PLATFORM_SQLSERVER_DATABASE: ${ACSOURCE_DB:?必填}
      PLATFORM_ACSOURCE_TIMEZONE: ${ACSOURCE_TIMEZONE:-Asia/Shanghai}
      PLATFORM_SQLSERVER_CHARSET: ${ACSOURCE_CHARSET:-UTF-8}
      # 台账聚合采集器（docs/DATASET_DESIGN.md §12、§13）。分桶时区与 api 角色
      # 同值，理由见那一侧的告诫
      PLATFORM_DATASET_BUCKET_TIMEZONE: ${DATASET_BUCKET_TIMEZONE:-Asia/Shanghai}
      # ⚠ 默认关。它同时是**运行参数**：界面上（dataset 分组）改一下立刻生效，
      # 且覆盖值优先于这里——这一行只是没被覆盖时的取值
      PLATFORM_DATASET_ENABLED: ${DATASET_ENABLED:-false}
      PLATFORM_DATASET_INTERVAL_S: ${DATASET_INTERVAL_S:-60.0}
      PLATFORM_DATASET_RECOMPUTE_TAIL_BUCKETS: ${DATASET_RECOMPUTE_TAIL_BUCKETS:-2}
      PLATFORM_DATASET_MAX_BUCKETS_PER_TICK: ${DATASET_MAX_BUCKETS_PER_TICK:-240}
      PLATFORM_DATASET_TABLE_TIMEOUT_S: ${DATASET_TABLE_TIMEOUT_S:-60.0}
      PLATFORM_DATASET_LEASE_TTL_S: ${DATASET_LEASE_TTL_S:-180}
      # ⚠ 回退链必须与 platform-server 逐字一致：少写一处就是非对称失效
      PLATFORM_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      PLATFORM_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      PLATFORM_COLLECT_CREDENTIAL_SECRET: ${COLLECT_CREDENTIAL_SECRET:?必填}
      # 模型供应商目录的加密密钥（ADR-0039）。⚠ 留空即目录整个缺席：模型管理页
      # 回 503，助手与知识库退回各自环境变量那一档——不是启动失败
      PLATFORM_LLM_PROVIDER_SECRET: ${LLM_PROVIDER_SECRET:-}
      # ⚠ 8008 不是 8000——8000 是 realtime-hub 的
      PLATFORM_OPCUA_BASE_URL: http://opcua-server:8008
      PLATFORM_REDIS_HOST: ${REDIS_HOST:?必填}
      PLATFORM_REDIS_PORT: ${REDIS_PORT:-6379}
      PLATFORM_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PLATFORM_ACSTARTUP_STREAM: ${ACSTARTUP_STREAM:-platform:ac-startup:shards}
      PLATFORM_ACSTARTUP_GROUP: ${ACSTARTUP_GROUP:-ac-startup-workers}
      # ⚠ 三个角色共用一份 Settings，故这四项**每个角色都要给全**，哪怕本角色
      # 一个字节都不读：启动即全量校验，少给一处就是这个角色起不来，而现象是
      # 「api 好好的，抽取任务全不动」
      PLATFORM_OBJECTSTORE_ENDPOINT: ${OSS_ENDPOINT:?必填}
      PLATFORM_OBJECTSTORE_BUCKET: ${OSS_BUCKET:-digitaltwin}
      PLATFORM_OBJECTSTORE_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      PLATFORM_OBJECTSTORE_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
      PLATFORM_OBJECTSTORE_PUBLIC_BASE: ${OSS_PUBLIC_BASE:-/oss/}
    restart: unless-stopped

  # 同一份镜像的 publisher 角色：只跑大屏实时发布循环。
  # ⚠ **无 expose、无探针**——它不接流量，「摘掉它」没有意义；能不能干活由租约
  # 与推送日志说话（DASHBOARD_DESIGN §6）。
  # ⚠ **全局单活**：多起一个副本不会加吞吐，只会让两个进程抢同一把租约；抢不到
  # 的那个是热备，它在原主让位后立刻接管，不必等满一个 TTL。
  platform-publisher:
    build:
      context: ../server
      dockerfile: services/platform-server/Dockerfile
    depends_on:
      realtime-hub: {condition: service_started}
      platform-migrate: {condition: service_completed_successfully}
    environment:
      PLATFORM_APP_ROLE: publisher
      PLATFORM_APP_LOG_FORMAT: json
      PLATFORM_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      PLATFORM_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PLATFORM_POSTGRES_USER: ${POSTGRES_USER:?必填}
      PLATFORM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      PLATFORM_POSTGRES_DB: ${POSTGRES_DB:?必填}
      PLATFORM_SQLSERVER_HOST: ${ACSOURCE_HOST:?必填：现场 EMS 库地址}
      PLATFORM_SQLSERVER_PORT: ${ACSOURCE_PORT:-1433}
      PLATFORM_SQLSERVER_USER: ${ACSOURCE_USER:?必填}
      PLATFORM_SQLSERVER_PASSWORD: ${ACSOURCE_PASSWORD:?必填}
      PLATFORM_SQLSERVER_DATABASE: ${ACSOURCE_DB:?必填}
      PLATFORM_ACSOURCE_TIMEZONE: ${ACSOURCE_TIMEZONE:-Asia/Shanghai}
      # 组合根装配时就要解析这个时区名，故三个角色都要带上；取值也必须
      # 三处同值（§4.5.1）
      PLATFORM_DATASET_BUCKET_TIMEZONE: ${DATASET_BUCKET_TIMEZONE:-Asia/Shanghai}
      PLATFORM_SQLSERVER_CHARSET: ${ACSOURCE_CHARSET:-UTF-8}
      # ⚠ 回退链必须与 platform-server 逐字一致：少写一处就是非对称失效
      PLATFORM_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      # 打 hub 内部推送端点用的服务级密钥，与 realtime-hub 同值
      PLATFORM_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      PLATFORM_COLLECT_CREDENTIAL_SECRET: ${COLLECT_CREDENTIAL_SECRET:?必填}
      # 模型供应商目录的加密密钥（ADR-0039）。⚠ 留空即目录整个缺席：模型管理页
      # 回 503，助手与知识库退回各自环境变量那一档——不是启动失败
      PLATFORM_LLM_PROVIDER_SECRET: ${LLM_PROVIDER_SECRET:-}
      # 快照读侧与租约都用它，与 collector 写快照的是同一个实例
      PLATFORM_REDIS_HOST: ${REDIS_HOST:?必填}
      PLATFORM_REDIS_PORT: ${REDIS_PORT:-6379}
      PLATFORM_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 主题登记/注销与批推都打它。⚠ 不可达时降级为「没有实时通道」
      PLATFORM_REALTIME_BASE_URL: http://realtime-hub:8000
      # 合并窗口：一拍读一次快照、推一批。节流归推送方，不归 hub。
      # 它是全平台实时数据的时间分辨率上限，可在 系统 → 运行参数 里在线改
      PLATFORM_PUBLISH_WINDOW_MS: ${DASHBOARD_PUBLISH_WINDOW_MS:-2000}
      # ⚠ 必须 ≤ hub 的条目上限（默认 500），超了每一批都会被 413
      PLATFORM_PUBLISH_MAX_ITEMS: ${DASHBOARD_PUBLISH_MAX_ITEMS:-200}
      # 快照多旧就算陈旧。陈旧值照推但标注为陈旧，不许当成现值
      # ⚠ 同上：本角色不读字节，但共用的 Settings 校验这四项，少给就起不来
      PLATFORM_OBJECTSTORE_ENDPOINT: ${OSS_ENDPOINT:?必填}
      PLATFORM_OBJECTSTORE_BUCKET: ${OSS_BUCKET:-digitaltwin}
      PLATFORM_OBJECTSTORE_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      PLATFORM_OBJECTSTORE_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
      PLATFORM_OBJECTSTORE_PUBLIC_BASE: ${OSS_PUBLIC_BASE:-/oss/}
    restart: unless-stopped

  # 采集运行时：唯一持有现场连接的进程。
  # ⚠ 它必须跑在**有工控网卡**的宿主机上，且容器网络要能路由到工控网段
  # （host network / macvlan / 宿主机静态路由），见 ARCHITECTURE §7。这是节点级
  # 部署前置条件，不是应用配置——配不对的表现是「服务健康但一个点位都采不到」。
  # ⚠ 无 expose：8007 只有探针，业务面在 platform，取数走 Redis 快照。
  # 副本策略是单活 + 热备（租约竞选），compose 单机只跑一份。
  collector-server:
    build:
      context: ../server
      dockerfile: services/collector-server/Dockerfile
    depends_on:
      platform-server: {condition: service_started}
      collect-migrate: {condition: service_completed_successfully}
    environment:
      COLLECT_APP_ROLE: collector
      COLLECT_APP_LOG_FORMAT: json
      COLLECT_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      COLLECT_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      COLLECT_POSTGRES_USER: ${POSTGRES_USER:?必填}
      COLLECT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      COLLECT_POSTGRES_DB: ${POSTGRES_DB:?必填}
      COLLECT_POSTGRES_SCHEMA: collect
      COLLECT_REDIS_HOST: ${REDIS_HOST:?必填}
      COLLECT_REDIS_PORT: ${REDIS_PORT:-6379}
      COLLECT_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 同值。少写一处就是非对称失效：拉计划一律 401，
      # 表现是采集永久空转，而现象与原因隔得极远。
      COLLECT_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      COLLECT_PLATFORM_BASE_URL: http://platform-server:8005
      COLLECT_PLAN_REFRESH_INTERVAL_S: ${COLLECT_PLAN_REFRESH_INTERVAL_S:-30.0}
      COLLECT_FLUSH_INTERVAL_MS: ${COLLECT_FLUSH_INTERVAL_MS:-300}
      # ⚠ 每次 flush 续期：采集进程死掉后快照跟着过期，大屏于是拿不到值，
      # 而不是拿着一份永不更新的旧值当实时值看
      COLLECT_SNAPSHOT_TTL_S: ${COLLECT_SNAPSHOT_TTL_S:-60}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8007/api/v1/collector/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  realtime-hub:
    build:
      context: ../server
      dockerfile: services/realtime-hub/Dockerfile
    depends_on:
      realtime-migrate: {condition: service_completed_successfully}
    environment:
      REALTIME_APP_ROLE: hub
      REALTIME_APP_LOG_FORMAT: json
      REALTIME_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      REALTIME_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REALTIME_POSTGRES_USER: ${POSTGRES_USER:?必填}
      REALTIME_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      REALTIME_POSTGRES_DB: ${POSTGRES_DB:?必填}
      REALTIME_POSTGRES_SCHEMA: realtime
      REALTIME_REDIS_HOST: ${REDIS_HOST:?必填}
      REALTIME_REDIS_PORT: ${REDIS_PORT:-6379}
      REALTIME_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ⚠ 与 auth-server 同值。少写一处就是非对称失效：签得出、验不了，
      # 表现为一律 403，而现象与原因隔得极远。
      REALTIME_EDGE_SIGNING_SECRET: ${AUTH_EDGE_SIGNING_SECRET:?必填}
      REALTIME_EDGE_SERVICE_KEY: ${AUTH_EDGE_SERVICE_KEY:?必填}
      # ⚠ 验 WS 子协议里那枚 access token 用，必须与 auth-server 同值：
      # 本服务只验不签
      REALTIME_JWT_SECRET: ${AUTH_JWT_SECRET:?必填}
      REALTIME_AUTH_BASE_URL: http://auth-server:8004
      # 匿名连接（公开大屏）的名额与复核。⚠ 名额按**副本**计：它防的是一枚
      # 泄露的公开令牌把单个副本的连接池吃满（ADR-0021）
      REALTIME_PUBLIC_MAX_CONNECTIONS: ${REALTIME_PUBLIC_MAX_CONNECTIONS:-500}
      REALTIME_PUBLIC_MAX_CONNECTIONS_PER_TICKET: ${REALTIME_PUBLIC_MAX_CONNECTIONS_PER_TICKET:-50}
      # 撤回一条公开链接之后，已经连着的那些最多这么久被断掉
      REALTIME_PUBLIC_RECHECK_INTERVAL_S: ${REALTIME_PUBLIC_RECHECK_INTERVAL_S:-15}
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/realtime/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  opcua-pki:
