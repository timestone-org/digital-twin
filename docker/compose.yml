      ASSISTANT_POSTGRES_POOL_OVERFLOW: ${ASSISTANT_POSTGRES_POOL_OVERFLOW:-5}
      ASSISTANT_POSTGRES_CONNECT_TIMEOUT_S: ${ASSISTANT_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
      ASSISTANT_POSTGRES_STATEMENT_TIMEOUT_MS: ${ASSISTANT_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
      ASSISTANT_POSTGRES_LOCK_TIMEOUT_MS: ${ASSISTANT_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      KNOWLEDGE_POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      KNOWLEDGE_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      KNOWLEDGE_POSTGRES_USER: ${POSTGRES_USER:?必填}
      KNOWLEDGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      KNOWLEDGE_POSTGRES_DB: ${POSTGRES_DB:?必填}
      KNOWLEDGE_POSTGRES_SCHEMA: knowledge
      KNOWLEDGE_POSTGRES_POOL_SIZE: ${KNOWLEDGE_POSTGRES_POOL_SIZE:-10}
      KNOWLEDGE_POSTGRES_POOL_OVERFLOW: ${KNOWLEDGE_POSTGRES_POOL_OVERFLOW:-5}
      KNOWLEDGE_POSTGRES_CONNECT_TIMEOUT_S: ${KNOWLEDGE_POSTGRES_CONNECT_TIMEOUT_S:-5.0}
      KNOWLEDGE_POSTGRES_STATEMENT_TIMEOUT_MS: ${KNOWLEDGE_POSTGRES_STATEMENT_TIMEOUT_MS:-2000}
      KNOWLEDGE_POSTGRES_LOCK_TIMEOUT_MS: ${KNOWLEDGE_POSTGRES_LOCK_TIMEOUT_MS:-3000}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:?必填}
      AUTH_SEED_ADMIN_USERNAME: ${AUTH_SEED_ADMIN_USERNAME:-admin}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@example.com}
      POSTGRES_HOST: ${POSTGRES_HOST:?必填}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${MIGRATION_POSTGRES_USER:-${POSTGRES_USER:?必填}}
      POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?必填}}
      POSTGRES_DB: ${POSTGRES_DB:?必填}
      MIGRATION_DATABASE_WAIT_TIMEOUT_S: ${MIGRATION_DATABASE_WAIT_TIMEOUT_S:-120}
      MIGRATION_COMMAND_TIMEOUT_S: ${MIGRATION_COMMAND_TIMEOUT_S:-600}
    restart: 'no'

  auth-server:
    image: digitaltwin/auth-server:${IMAGE_TAG:-dev}
    build:
      context: ../server
      dockerfile: services/auth-server/Dockerfile
    # ⚠ 等迁移与种子跑完再起：权限码目录是代码里的真源，先起服务后灌种子的话，
    # 中间那段窗口里新端点一律 403，而两边代码单看都对
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *auth-environment
      AUTH_APP_ROLE: api
    expose: ['8004']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/api/v1/auth/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  platform-server:
    image: digitaltwin/platform-server:${IMAGE_TAG:-dev}
    build: &platform-build
      context: ../server
      dockerfile: services/platform-server/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: api
    expose: ['8005']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/api/v1/platform/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # AI 助手。⚠ 它是**可缺席**的：没有它，前端探测失败之后入口干净地不出现，
  # 别的功能一件不少（features/ai/ports.ts）。所以边缘不给它挂 service_healthy，
  # 它起不来也不该拖着整个站不启动。
  # ⚠ 没配 ASSISTANT_MODEL_API_KEY 时服务照常起，只是能力面回「没接模型」——
  # 密钥类绝不给默认值，而弱默认的密钥等于没有密钥（config-and-secrets §2）。
  ai-assistant:
    image: digitaltwin/ai-assistant:${IMAGE_TAG:-dev}
    build:
      context: ../server
      dockerfile: services/ai-assistant/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *assistant-environment
      ASSISTANT_APP_ROLE: api
    expose: ['8006']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/api/v1/assistant/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  knowledge-server:
    image: digitaltwin/knowledge-server:${IMAGE_TAG:-dev}
    build: &knowledge-build
      context: ../server
      dockerfile: services/knowledge-server/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *knowledge-environment
      KNOWLEDGE_APP_ROLE: api
    expose: ['8009']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/api/v1/knowledge/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # 同一份镜像的 worker 角色：解析、切块、嵌入、来源同步。
  # ⚠ **无 expose、无探针**——它不接流量，「摘掉它」没有意义；能不能干活由队列
  # 深度与日志说话。
  # ⚠ 它**可以多副本**：队列是消费组，副本之间自动分活。与 publisher 那种
  # 单活租约不是一回事。
  knowledge-worker:
    image: digitaltwin/knowledge-server:${IMAGE_TAG:-dev}
    build: *knowledge-build
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *knowledge-environment
      KNOWLEDGE_APP_ROLE: worker
    restart: unless-stopped

  # 素材字节面的建桶脚本：建桶并把三个公开前缀设成匿名可读；跑完即退出。
  # ⚠ 对象存储本身与 PostgreSQL / Redis 同档——它是**外部部署单元**，不由本编排
  # 起停（ADR-0015），故这里连的是 OSS_ENDPOINT 而不是某个服务名。它的数据目录
  # 与数据库同级纳入备份清单：素材没了，存量大屏里的每一个 asset: 引用都会变成
  # 「取不到」。
  # ⚠ `staging/` 刻意不在列：未验证的字节不许有一个本站链接。
  # ⚠ 失败即退出、不重试：桶策略配歪了要当场看见，让它悄悄重试的结果是
  # 匿名前缀没设上，而现象要等到现场大屏机取模型时才是一个 403。
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      OSS_ENDPOINT: ${OSS_ENDPOINT:?必填：对象存储地址，带 scheme}
      OSS_BUCKET: ${OSS_BUCKET:-digitaltwin}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:?必填}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:?必填}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set dt "$$OSS_ENDPOINT" "$$OSS_ACCESS_KEY" "$$OSS_SECRET_KEY"
        mc mb --ignore-existing "dt/$$OSS_BUCKET"
        for prefix in models images icons; do
          mc anonymous set download "dt/$$OSS_BUCKET/$$prefix"
        done
    restart: 'no'

  # 外部解析服务（ADR-0043）：PDF 与扫描件走它，Office 与纯文本仍由
  # knowledge-worker 在本进程里解——本地那几路解得更准，也不花这台机器的 CPU。
  # ⚠ 单开一个 profile：镜像 2.4 GB、模型另有 2.4 GB，而**没有它整套照样跑得
  # 起来**，只是不收 PDF。要它就 `docker compose --profile mineru up -d`。
  # ⚠ 不对外开端口：只有同网的 knowledge-worker 调它。
  mineru:
    profiles: ['mineru']
    build:
      context: ./mineru
    depends_on:
      mineru-models: {condition: service_completed_successfully}
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
    volumes:
      - mineru-models:/models
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      # ⚠ 比别的服务宽：它启动要把版面/公式/OCR 三套权重载进内存，
      # 冷启在这台机器上要十几秒，而 10s×3 会让它一直被判不健康
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # 模型下载作业：跑完即退出，与 minio-init 同档。
  # ⚠ 做成一步显式作业而不是「第一次解析时顺手下」：顺手下的表现是第一份文档
  # 解析超时，而原因是在下 2.4 GB 权重——那条链路上没有任何一处会这么说。
  # ⚠ 已经下过的会被 ModelScope 的缓存跳过，所以每次 up 重跑它是廉价的。
  mineru-models:
    profiles: ['mineru']
    build:
      context: ./mineru
    command: ['mineru-models-download', '-s', '${MINERU_MODEL_SOURCE:-modelscope}', '-m', 'pipeline']
    volumes:
      - mineru-models:/models
    restart: 'no'

  # ⚠ 与其它服务不同，这个服务**自己对外开端口**：opc.tcp 是二进制 TCP，
  # nginx 只有 http block，转不了。只有 8008 的 HTTP 管理面走边缘。
  # 端口段与 OPCUA_PORT_POOL 必须逐字一致——池外的端口没有映射出去，
  # 实例会「显示运行中但连不上」，是最难排查的一类故障（见 ADR-0006）。
  opcua-server:
    image: digitaltwin/opcua-server:${IMAGE_TAG:-dev}
    build:
      context: ../server
      dockerfile: services/opcua-server/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *opcua-environment
      OPCUA_APP_ROLE: api
    expose: ['8008']
    ports:
      - '${OPCUA_PORT_POOL:-4840-4859}:${OPCUA_PORT_POOL:-4840-4859}'
    volumes:
      # 服务器私钥只在这个卷上——不进镜像层、不进数据库、不随备份外流。
      # 卷没了等于全部实例的证书没了，上位机需要重新信任新证书。
      - opcua-pki:/var/lib/opcua/pki
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/api/v1/opcua/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # 同一份镜像的 worker 角色：只跑抽取分片的消费循环，不监听 HTTP。
  # ⚠ 重任务永远不在 api 角色里跑（ARCHITECTURE §3.4）；扩缩靠加副本，
  # 多个 worker 共用一个消费组，各取各的分片。
  platform-worker:
    image: digitaltwin/platform-server:${IMAGE_TAG:-dev}
    build: *platform-build
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: worker
    restart: unless-stopped

  # 同一份镜像的 publisher 角色：只跑大屏实时发布循环。
  # ⚠ **无 expose、无探针**——它不接流量，「摘掉它」没有意义；能不能干活由租约
  # 与推送日志说话（DASHBOARD_DESIGN §6）。
  # ⚠ **全局单活**：多起一个副本不会加吞吐，只会让两个进程抢同一把租约；抢不到
  # 的那个是热备，它在原主让位后立刻接管，不必等满一个 TTL。
  platform-publisher:
    image: digitaltwin/platform-server:${IMAGE_TAG:-dev}
    build: *platform-build
    depends_on:
      realtime-hub: {condition: service_started}
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *platform-environment
      PLATFORM_APP_ROLE: publisher
    restart: unless-stopped

  # 采集运行时：唯一持有现场连接的进程。
  # ⚠ 它必须跑在**有工控网卡**的宿主机上，且容器网络要能路由到工控网段
  # （host network / macvlan / 宿主机静态路由），见 ARCHITECTURE §7。这是节点级
  # 部署前置条件，不是应用配置——配不对的表现是「服务健康但一个点位都采不到」。
  # ⚠ 无 expose：8007 只有探针，业务面在 platform，取数走 Redis 快照。
  # 副本策略是单活 + 热备（租约竞选），compose 单机只跑一份。
  collector-server:
    image: digitaltwin/collector-server:${IMAGE_TAG:-dev}
    build:
      context: ../server
      dockerfile: services/collector-server/Dockerfile
    depends_on:
      platform-server: {condition: service_started}
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *collect-environment
      COLLECT_APP_ROLE: collector
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8007/api/v1/collector/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  realtime-hub:
    image: digitaltwin/realtime-hub:${IMAGE_TAG:-dev}
    build:
      context: ../server
      dockerfile: services/realtime-hub/Dockerfile
    depends_on:
      database-migrate: {condition: service_completed_successfully}
    environment:
      <<: *realtime-hub-environment
      REALTIME_APP_ROLE: hub
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/realtime/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  # MinerU 的模型权重（约 2.4 GB）与它的 `mineru.json`。⚠ 不烤进镜像：
  # 它与代码无关，烤进去每次重建都要重下一遍
  mineru-models:
  opcua-pki:
