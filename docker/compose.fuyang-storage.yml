# 阜阳光伏独立存储；应用角色仍在本地运行。
name: fuyang-pv-storage

services:
  postgres:
    image: ${FUYANG_POSTGRES_IMAGE:?必填：已验证的 PostgreSQL 镜像摘要}
    container_name: fuyang-pv-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?必填}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必填}
      POSTGRES_DB: ${POSTGRES_DB:?必填}
    ports:
      - '${FUYANG_POSTGRES_PORT:-25432}:5432'
    volumes:
      - postgres-data:/home/postgres/pgdata
    command:
      - postgres
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: ${FUYANG_MINIO_IMAGE:?必填：已验证的 MinIO 镜像摘要}
    container_name: fuyang-pv-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:?必填}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:?必填}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${FUYANG_MINIO_API_PORT:-19000}:9000'
      - '${FUYANG_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data

  redis:
    image: ${FUYANG_REDIS_IMAGE:?必填：已验证的 Redis 镜像摘要}
    container_name: fuyang-pv-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD?必填：原服务未设置时显式留空}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - '${FUYANG_REDIS_PORT:-26379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  minio-data:
  redis-data:
