packages:
  - 'packages/*'
  - 'app'

# Umo 固定旧 core，传递依赖也必须落到安全版本。
overrides:
  '@tiptap/core': '3.31.3'
  '@tiptap/pm': '3.31.3'
  # 数学扩展的官方 peer 范围从此版接受安全 KaTeX 0.18。
  '@umoteam/editor@11.1.1>@tiptap/extension-mathematics': '3.31.3'
  '@tiptap/extension-table-of-contents@3.20.0>uuid': '11.1.1'
  '@tiptap/extension-unique-id@3.20.0>uuid': '11.1.1'
  '@umoteam/editor-external@10.1.0>echarts': '6.1.0'
  'katex@<0.18.2': '0.18.2'
  'mermaid@11.17.2>dompurify': '3.4.16'
  'js-yaml@^4': '4.3.2'
  'brace-expansion@^2': '2.1.7'
  # Umo 11.1.1 的浏览器产物不使用 Node 构建依赖 fast-glob。
  '@umoteam/editor@11.1.1>fast-glob': '-'
  # Vitest 3 的 ^1 无安全版；限定到 Vitest 的池依赖。
  'vitest@3.2.7>tinypool': '2.1.2'

# 安装脚本必须逐个表态：没表态的包在干净检出上会让 `--frozen-lockfile` 直接
# 失败（ERR_PNPM_IGNORED_BUILDS），而本地因为决定被缓存着，一切照常。
allowBuilds:
  # esbuild 与 vue-demi 的安装脚本是它们正常工作的前提，显式放行
  esbuild: true
  vue-demi: true
  # ⚠ @parcel/watcher 只是 sass-embedded 的文件监听后端，编不出原生模块时
  # 自动退回轮询。CI 不需要它，编译它反而多一段跑在安装期的任意代码。
  '@parcel/watcher': false
  # Umo 间接依赖 core-js；它的安装脚本只打印兼容性/赞助信息，运行时不依赖该脚本。
  core-js: false
