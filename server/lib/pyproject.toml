[project]
name = "lib"
version = "0.1.0"
description = "通用基础设施：配置、日志、异常、响应、DB、缓存、限流、令牌。"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
]
mssql = ["pymssql>=2.3.13"]
redis = ["redis>=5.2"]
# S3 兼容对象存储。boto3 是协议的参考实现，自建服务端都对着它测
s3 = ["boto3>=1.35"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
auth = ["pyjwt>=2.10", "argon2-cffi>=23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["lib"]
omit = ["*/testing/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
