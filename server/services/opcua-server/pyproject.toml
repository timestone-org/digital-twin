[project]
name = "opcua-server"
version = "0.1.0"
description = "对上位系统暴露 opc.tcp 端点，托管多个 OPC UA 服务器实例。"
requires-python = ">=3.12"
dependencies = [
    "lib[db,redis,web]",
    # 钉死而非范围：会话追踪要子类化 InternalServer/InternalSession，
    # 那两个扩展点不在文档化的公开 API 里，见 CONTEXT.md §5。
    "asyncua==1.1.8",
]

[project.scripts]
opcua-server = "opcua_server.__main__:main"

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opcua_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]

[tool.coverage.run]
branch = true
source = ["opcua_server"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
