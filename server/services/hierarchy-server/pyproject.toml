[project]
name = "hierarchy-server"
version = "0.1.0"
description = "可选的计量层级图项目与版本服务"
requires-python = ">=3.12"
dependencies = ["lib[auth,db,redis,web]"]

[project.scripts]
hierarchy-server = "hierarchy_server.__main__:main"

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hierarchy_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["requires_postgres: 需要真实 PostgreSQL", "requires_redis: 需要真实 Redis"]

[tool.coverage.run]
branch = true
# ⚠ SQLAlchemy 的异步 DBAPI 经 greenlet 执行，覆盖率需跟踪切换。
concurrency = ["thread", "greenlet"]
source = ["hierarchy_server"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
