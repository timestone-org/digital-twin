[project]
name = "auth-server"
version = "0.1.0"
description = "认证、RBAC 权限判定、路由规则与边缘鉴权端点。"
requires-python = ">=3.12"
dependencies = [
    "lib[auth,db,redis,web]",
    "email-validator>=2.2",
]

[project.scripts]
auth-server = "auth_server.__main__:main"
auth-seed = "scripts.seed:main"
auth-openapi = "scripts.export_openapi:main"

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_server", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]

[tool.coverage.run]
branch = true
source = ["auth_server"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
