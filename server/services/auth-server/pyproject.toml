[project]
name = "auth-server"
version = "0.1.0"
description = "认证、RBAC 权限判定、路由规则与边缘鉴权端点。"
requires-python = ">=3.12"
dependencies = [
    "lib[auth,db,redis,web]",
    "email-validator>=2.2",
]

[project.scripts]
auth-server = "auth_server.__main__:main"

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠ `scripts` 不进 wheel：每个服务都有一个同名的顶层 `scripts` 包，装进同一个
# workspace venv 就会互相遮蔽——`uv run auth-openapi` 会静默跑成别的服务那份，
# 而且谁赢取决于安装顺序。一次性命令一律 `uv run python -m scripts.<名>`，
# 在服务目录下跑，由 CWD 决定用哪份，是确定的。
[tool.hatch.build.targets.wheel]
packages = ["src/auth_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]

[tool.coverage.run]
branch = true
# ⚠ SQLAlchemy 的 async 面把同步 DBAPI 的活放在 greenlet 里跑。不声明并发口径，
# 协程在 `await` 之后恢复的那些行 coverage 一行都记不上——整体数字会被低报十几个
# 百分点，而报告本身看起来完全正常，只是「这几行没测到」是假的。
concurrency = ["thread", "greenlet"]
source = ["auth_server"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
