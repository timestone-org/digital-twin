[project]
name = "ai-assistant"
version = "0.1.0"
description = "对话式助手：按当前工作面装配技能，编排模型与工具，把每一步如实推给前端。"
requires-python = ">=3.12"
dependencies = [
    # ⚠ 四档一个都不能省，且必须自己声明：开发用的是 workspace 共享 venv，
    # 别的服务装进来的包在本地和全部用例里都能 import 成功，只有按自己声明的
    # 依赖装的独立镜像会启动即崩（check_service_deps.py 守这条）。
    #   auth   —— 边缘签名身份头要 lib.auth 解，服务级密钥要它的定长比较
    #   crypto —— 模型账号的令牌加密落库
    #   db     —— 会话、消息、步骤、模型凭据四张表
    #   redis  —— 幂等键存储、断路器状态、设备码登录的在途会话
    #   web    —— FastAPI 与 uvicorn
    "lib[auth,crypto,db,redis,web]",
    # 打模型端点与 platform 内部面。⚠ 必须自己声明：httpx 在工作区根的 dev 组里，
    # 本地与全部用例都 import 得到，只有按自己声明的依赖装的镜像会崩。
    "httpx>=0.28",
    # 回合编排。选它是因为「跑到一半停下来等外部把工具跑完、再接着跑」是它的
    # 一等公民（interrupt / Command），而这正是本服务的循环形状：改画布的工具
    # 在浏览器里执行，api 角色无状态，续跑可能落到另一个副本上。
    #
    # ⚠ **刻意不装 `langgraph-checkpoint-postgres`**，两条理由各自都足够：
    #   1. 它自己建表，绕过 alembic——而本仓的口径是「一张表只有一个属主、
    #      只有属主管迁移」（ADR-0003）。让一个库在我们背后建表，等于把
    #      schema 的所有权交出去，扩展—收缩两次发布也就无从谈起。
    #   2. 它把 psycopg（LGPL-3.0-only）拖进依赖树，而本仓的许可证闸拦 LGPL。
    # 续跑状态落在我们自己的 `chat_steps` 上，形状比通用 checkpoint 窄得多：
    # 中断点只有一个（等客户端工具），要存的就是那一批待执行的调用。
    # ⚠ 直接声明 openai：我们按它的异常类型分档「是下游不行」还是「是我们发错了」，
    # 而那个判断决定断路器开不开。靠 langchain-openai 顺带装进来的话，
    # check_service_deps 迟早会逮到，而且它换传输层时我们会静默失去这份分档。
    "openai>=3.3",
    # 读用户上传的点表。⚠ 放后端而不是前端是刻意的：前端当初拒绝引 xlsx 解析库
    # 的理由是「几百 KB 的包体」（见 pointCsv.ts 的文件头），而那条理由在服务端
    # 不成立；现场拿到的点表又十有八九是 xlsx 或 csv。
    "openpyxl>=3.1",
    "langgraph>=1.2",
    "langchain-openai>=1.6",
]

[project.scripts]
ai-assistant = "ai_assistant.__main__:main"
# ⚠ 这里**不**登记 openapi 导出的 console 入口：`scripts` 是顶层包名，别的
# 服务已经把它打进 wheel，同一个 venv 里两份会互相覆盖——导出脚本可能改写
# **另一个服务**的 openapi.json。导出一律按路径调：
#   uv run python scripts/export_openapi.py

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]
# ⚠ 警告一律当红灯：CI 日志里的黄字没人回头看，而一条 DeprecationWarning
# 就是下次升级依赖时的失败。要留的例外必须逐条写在这里，说清为什么留。
filterwarnings = [
    "error",
    # 上游对订阅账号那一路的实验性声明。走这条路是拍过板的（理由见
    # llm/codex/model.py 的文件头），每次构造都喊一遍只会淹掉真警告
    "ignore:`_ChatOpenAICodex` is experimental:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["ai_assistant"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
