[project]
name = "collector-server"
version = "0.1.0"
description = "连接现场数据源、订阅采样、写实时快照与历史归档的采集运行时。"
requires-python = ">=3.12"
dependencies = [
    # ⚠ 三档一个都不能省，且必须自己声明：开发用的是 workspace 共享 venv，
    # 别的服务装进来的包在本地和全部用例里都能 import 成功，只有按自己声明的
    # 依赖装的独立镜像会启动即崩（check_service_deps.py 守这条）。
    #   db    —— 采集运行态表与迁移链（schema collect）
    #   redis —— 选主租约、快照哈希、命令总线，见 CONTEXT.md §5
    #   web   —— FastAPI 与 uvicorn，只用来挂 /health 与 /ready 探针
    "lib[db,redis,web]",
    # 点位身份与归档值编解码的唯一真源，采集侧写、平台侧读（ADR-0004）
    "timeseries",
    # 计划、命令信封、快照键与运行态列名的唯一真源，与 platform 共用（ADR-0017）
    "collectwire",
    # ⚠ 钉死而非范围：workspace 共用一个锁文件，opcua-server 也钉在这个版本，
    # 两处写不同范围只会让升级时其中一个静默变版本。本服务只用文档化的
    # `Client` 面，且 asyncua **只允许出现在 drivers/opcua/ 下**（CONTEXT.md §3）。
    "asyncua==1.1.8",
    # 拉采集计划：platform 的 /internal/v1/platform/collect-plan。
    # ⚠ 必须自己声明：httpx 在工作区根的 dev 组里，本地与全部用例都 import
    # 得到，只有按自己声明的依赖装的镜像会启动即崩。
    "httpx>=0.28",
]

[project.scripts]
collector-server = "collector_server.__main__:main"

[tool.uv.sources]
lib = { workspace = true }
timeseries = { workspace = true }
collectwire = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]

[tool.coverage.run]
# 分支覆盖照开。ADR-0008 关掉它是 opcua-server 独有的豁免（asyncua 的生成
# 函数拖死追踪器），本服务不起 asyncua 的 Server，没有那个约束。
branch = true
source = ["collector_server"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
