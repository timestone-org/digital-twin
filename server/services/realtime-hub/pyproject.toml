[project]
name = "realtime-hub"
version = "0.1.0"
description = "WebSocket 连接与订阅管理，把服务端推来的消息按订阅扇出给客户端。"
requires-python = ">=3.12"
dependencies = [
    # ⚠ 四档一个都不能省，且必须自己声明：开发用的是 workspace 共享 venv，
    # 别的服务装进来的包在本地和全部用例里都能 import 成功，只有按自己声明的
    # 依赖装的独立镜像会启动即崩（check_service_deps.py 守这条）。
    #   auth  —— WS 子协议里的 token 要 lib.auth 解，服务级密钥要它的定长比较
    #   db    —— 主题声明与订阅两张表
    #   redis —— 跨副本扇出，见 CONTEXT.md §4
    #   web   —— FastAPI 与 uvicorn
    "lib[auth,db,redis,web]",
    # 登记主题时调 auth-server 的 /internal/v1/permission-codes 校验声明的码
    # （ADR-0007 §决策 4）。⚠ 必须自己声明：httpx 在工作区根的 dev 组里，
    # 本地与全部用例都 import 得到，只有按自己声明的依赖装的镜像会崩。
    "httpx>=0.28",
]

[project.scripts]
realtime-hub = "realtime_hub.__main__:main"
# ⚠ 这里**不**登记 openapi 导出的 console 入口：`scripts` 是顶层包名，别的
# 服务已经把它打进 wheel，同一个 venv 里两份会互相覆盖——导出脚本可能改写
# **另一个服务**的 openapi.json。导出一律按路径调：
#   uv run python scripts/export_openapi.py

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_postgres: 需要真实 Postgres（L2/L3/L4）",
    "requires_redis: 需要真实 Redis",
]

[tool.coverage.run]
# 分支覆盖照开。ADR-0008 关掉它是 opcua-server 独有的豁免（asyncua 的生成
# 函数拖死追踪器），本服务没有那个约束，不许顺手抄那份配置。
branch = true
source = ["realtime_hub"]
omit = [
    "*/migrations/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
