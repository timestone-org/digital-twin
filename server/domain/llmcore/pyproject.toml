[project]
name = "llmcore"
version = "0.1.0"
description = "OpenAI 兼容端点的调用面：端点形状、适配器口径、失败分档、逐字增量。零项目名词。"
requires-python = ">=3.12"
dependencies = [
    # 失败分档要 lib.errors 的 AppError 基类
    "lib",
    # 对话模型走 langchain 的抽象；嵌入直接走 openai 客户端
    "langchain-core>=1.0",
    "langchain-openai>=1.6",
    "openai>=3.3",
    # 端点密钥用 SecretStr 装着——从形状上就不许它被 print 出去
    "pydantic>=2.10",
]

[tool.uv.sources]
lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["llmcore"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
