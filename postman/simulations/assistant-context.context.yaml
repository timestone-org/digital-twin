      在本地合成协议下，助手能以普通 JSON 调用摘要模型、以 SSE 调用对话模型，
      把供应商 usage 映射为 context 事件，并保留全部会话历史。
    reason: >-
      验收运行真实应用与适配器；模型端 request 记录与数据库、HTTP detail 断言对应。
      该结论只覆盖所运行的合成协议响应。
    verification: >-
      2026-11-01 fingerprint assistant-context-20261101：运行
      server/.venv/bin/python postman/tests/verify_assistant_context.py。
      自动压缩场景产生两次非流式 summary 请求和一次流式 chat 请求；
      HTTP context 报告1520已用token、is_estimated=false，历史6条完整，
      summary_json保存有效切点。报告及记录见 docs/validation/2026-11-01-assistant-runtime.json。
    source: >-
      postman/tests/verify_assistant_context.py; postman/mocks/assistant-model/default.js;
      server/domain/llmcore/src/llmcore/openai_compat.py;
      docs/validation/2026-11-01-assistant-runtime.json
    updated_at: "2026-11-01"
  - id: local-overflow-recovery
    status: supported
    claim: >-
      在首次流式请求收到结构化400 context_length_exceeded且有可压缩历史时，
      助手生成摘要、缩小输入后恢复当前请求一次，回复只出现一份。
    reason: >-
      真实兼容适配器把HTTP错误交给真实GuardedModel和ContextModel，第二次chat成功；
      请求数量与消息字符数由模型端独立记录。
    verification: >-
      同一fingerprint运行：chat输入5037字符返回400；summary请求3583字符返回200；
      恢复chat输入1804字符返回200。输出只有一份，HTTP detail保留6条消息。
      另以16384预算观察到固定工具及提示词预算估算约14878，进一步压缩无收益，
      服务返回明确52203而不循环请求；这不是支持任意小窗口的证明。
    source: >-
      postman/tests/verify_assistant_context.py;
      server/services/ai-assistant/src/ai_assistant/apps/chat/services/context_model.py;
      docs/validation/2026-11-01-assistant-runtime.md
    updated_at: "2026-11-01"
  - id: local-receipt-continue
    status: supported
    claim: >-
      在合成模型请求客户端工具后，独立回执只写数据库，不推进模型；
      相同回执随后用于续跑时不会重复存储。
    reason: >-
      前后模型请求数由模拟端记录，实际回执数量从真实HTTP detail读取。
    verification: >-
      同一fingerprint运行：首次chat后收到client_tool.request，POST receipts后chat计数仍为1；
      续跑后chat计数为2，数据库仅一条对应wire-call-1的tool消息。
    source: >-
      postman/tests/verify_assistant_context.py;
      docs/validation/2026-11-01-assistant-runtime.json
    updated_at: "2026-11-01"
