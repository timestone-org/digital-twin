purpose:
  stands_in_for: >-
    未指定真实供应商的 OpenAI 兼容对话模型；响应仅为合成 Chat Completions JSON、
    SSE、usage 与机器可读上下文超限错误。没有供应商所有者 mock 可供复用，
    没有进行云端搜索、上传或部署。
  unblocks: >-
    真实 FastAPI socket HTTP、PostgreSQL、Redis、OpenAiCompatAdapter 与 GuardedModel
    的端到端调用验收；模型服务是唯一模拟依赖。
assumptions:
