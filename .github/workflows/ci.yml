# 主流水线。**只跑 main 的 push**：改动进了主干之后在真运行器上验一次，
# 分五段，前一段绿了才跑后一段。
#
# ⚠ 不收 pull_request：分支上的验证在本地，`scripts/ci-local.sh --all` 用 act
# 跑的就是这条流水线（同一份 YAML、同一批闸门脚本），改一次就能当场知道红绿，
# 不必推一次等一轮排队。两个触发器都收全部分支还会让一个开着
# PR 的分支每推一次跑**两条**完整流水线（push 与 pull_request 分属不同
# concurrency 组，互不取消），队列会被拖死——真发生过，45 个 run 积压 9 小时。
#
# ⚠ 因此 `5·全部闸门` 不能设成分支保护里的必需检查：PR 上没有这条流水线，
# 设成必需就是永远 pending、永远合不进去。合并前的绿灯由本地那条负责，
# 合并后这条红了按「main 永远可发布」当即修或回滚。见 ci-gates.md §5。
#
# 分段的意义是**反馈时序**：秒级的闸门（机密、结构、注释）先跑，它们红了
# 就不必再花几分钟装依赖跑测试；慢闸门（测试、构建、供应链）排在后面，
# 且只在快闸门全绿之后启动。闸门与规范条目的对照见 docs/agents/ci-gates.md。
#
# 这份文件不做 CD：产物构建与断言在这里，推送与部署不在。

name: CI

on:
  push:
    branches: [main]
  # 手动补跑：改了流水线本身、或要在真运行器上验一次分支时用。
  # 平时不用——开发期的验证是 scripts/ci-local.sh --all
  workflow_dispatch:

# ⚠ main 上**不取消**在跑的那一轮：它是唯一一次真运行器上的验证，接连合两个
# PR 时取消掉前一轮，就等于前一个改动谁都没验过。同组的下一轮排队等着跑，
# 主干于是逐个提交都验过。手动补跑的分支照旧取消，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ============ 第 1 段：秒级闸门 ============
  secrets:
    name: 1·机密扫描
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 写进版本库的密钥等于泄漏的密钥，而且历史层删不掉——扫全历史
      - name: gitleaks
        run: |
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  hygiene:
    name: 1·仓库卫生
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-gates
      - name: 供应链与仓库卫生（Action 按 SHA 固定、禁 latest、锁文件在仓）
        run: uv run --python 3.12 --no-project python scripts/gates/check_ci_hygiene.py

  structure:
    name: 1·结构与规范闸
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-gates

      # 这一批只读源码、只用标准库，所以排在最前面——它们是最便宜的红灯
      - name: 后端结构（project-structure-python §7）
        run: uv run --python 3.12 --no-project python scripts/gates/check_structure_python.py
      - name: 前端结构（project-structure-typescript §7）
        run: uv run --python 3.12 --no-project python scripts/gates/check_structure_web.py
      - name: 前端样式与页面布局
        run: uv run --python 3.12 --no-project python scripts/gates/check_web_styles.py
      - name: 前端依赖图（分层与零环）
        run: uv run --python 3.12 --no-project python scripts/gates/check_web_deps.py
      - name: Python 规模与压制指令
        run: uv run --python 3.12 --no-project python scripts/gates/check_python_style.py
      - name: Python 运行期正确性
        run: uv run --python 3.12 --no-project python scripts/gates/check_python_runtime.py
      - name: Python 命名
        run: uv run --python 3.12 --no-project python scripts/gates/check_python_naming.py
      - name: TS/Vue 风格
        run: uv run --python 3.12 --no-project python scripts/gates/check_ts_style.py
      - name: 注释规范
        run: uv run --python 3.12 --no-project python scripts/gates/check_comments.py
      - name: 可观测性（event 字面量、密钥不进日志、liveness 不查依赖）
        run: uv run --python 3.12 --no-project python scripts/gates/check_logging.py
      - name: 配置与密钥
        run: uv run --python 3.12 --no-project python scripts/gates/check_config_secrets.py
      - name: 数据库迁移
        run: uv run --python 3.12 --no-project python scripts/gates/check_migrations.py

      - name: 镜像的 workspace 成员
        run: uv run --python 3.12 --no-project python scripts/gates/check_docker_workspace.py
      - name: 对外契约（URL 形状、序列化口径、错误码）
        run: uv run --python 3.12 --no-project python scripts/gates/check_api_contract.py

      - name: 线形覆盖（出参形状都有契约用例钉住）
        run: uv run --python 3.12 --no-project python scripts/gates/check_wire_shapes.py
      - name: 测试质量（无断言用例、分层、skip）
        run: uv run --python 3.12 --no-project python scripts/gates/check_tests.py

  # ============ 第 2 段：静态检查 ============
  server-static:
    name: 2·后端格式/lint/类型
    needs: [secrets, hygiene, structure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-server

      - name: 格式（black，line-length 80）
        run: uv run --project server black --check --config server/pyproject.toml server scripts
      - name: Lint（ruff，零告警）
        run: uv run --project server ruff check --config server/pyproject.toml server scripts

      # 原始输出的切分与逐条报错都在 check_pyright.py 里，这里不依赖 jq
      - name: 类型（pyright strict）
        env:
          # 用运行器自带的 node，免掉 pyright 包装器每次跑都下一个
          PYRIGHT_PYTHON_GLOBAL_NODE: 'true'
        run: |
          (cd server && uv run pyright --outputjson > ../pyright.raw) || true
          uv run --project server python scripts/gates/check_pyright.py \
            pyright.raw pyright.json

      # ⚠ pyright 的 include 写错时会「0 errors 但一个源文件都没看」，
      # 必须单独断言它真的覆盖到了全部源码
      - name: 类型检查范围自检
        run: |
          uv run --project server python scripts/gates/check_typecheck_scope.py \
            pyright.json

      - name: 闸门脚本自身的类型
        run: uv run --project server pyright --project scripts

      # ⚠ 单仓共享 venv 会让一个服务用上别人装进来的包而毫无察觉——
      # import 成功、类型检查通过、全部用例绿，只有生产镜像会崩。
      # 这一步按各服务自己声明的依赖独立装一遍再整包 import。
      - name: 服务依赖自洽（按自己声明的依赖能否跑起来）
        run: uv run --project server python scripts/gates/check_service_deps.py

  web-static:
    name: 2·前端格式/lint/类型
    needs: [secrets, hygiene, structure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-web

      - name: 格式（prettier）
        working-directory: web
        run: pnpm format:check
      - name: Lint（eslint --max-warnings=0）
        working-directory: web
        # eslint 全量遍历吃内存与仓库规模成正比，超过 node 缺省堆顶会以 OOM 假死；
        # 抬堆不是放宽检查，规则一条没动
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm lint
      - name: 类型（vue-tsc）
        working-directory: web
        run: pnpm typecheck

  # ============ 第 3 段：测试 ============
  server-test:
    name: 3·后端测试与覆盖率
    needs: [server-static]
    runs-on: ubuntu-24.04

    # ⚠ L2/L3 必须打真实 Postgres：在 SQLite 上全绿的迁移与查询可以在生产上
    # 直接失败，而这类「测试通过但线上炸」是公网发布最不可接受的失败模式
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt
          POSTGRES_DB: dt
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U dt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # 服务容器的端口映射到 runner 上，所以一律走 localhost——
      # act 也是这么映射的，两边不需要各写一套地址
      AUTH_POSTGRES_HOST: localhost
      AUTH_POSTGRES_PORT: '55432'
      AUTH_POSTGRES_USER: dt
      AUTH_POSTGRES_PASSWORD: dt
      AUTH_POSTGRES_DB: dt
      AUTH_POSTGRES_SCHEMA: auth
      AUTH_REDIS_HOST: localhost
      AUTH_REDIS_PORT: '56379'
      LIB_TEST_POSTGRES_DSN: postgresql+asyncpg://dt:dt@localhost:55432/dt
      LIB_TEST_REDIS_URL: redis://localhost:56379/0
      # 只在 CI 进程里存在的测试用密钥，与任何环境的真实取值无关
      AUTH_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      AUTH_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      AUTH_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      # ⚠ 必须与集成用例里写死的口令一致：那几条用例是以种子管理员身份登录的
      AUTH_SEED_ADMIN_PASSWORD: Admin123456
      PLATFORM_POSTGRES_HOST: localhost
      PLATFORM_POSTGRES_PORT: '55432'
      PLATFORM_POSTGRES_USER: dt
      PLATFORM_POSTGRES_PASSWORD: dt
      PLATFORM_POSTGRES_DB: dt
      PLATFORM_POSTGRES_SCHEMA: platform
      # 外部只读库在 CI 里没有实例，用例一律打假外库。⚠ host 写成解析不出来的
      # 名字：真有用例去连它，要当场炸而不是连到别的什么东西上
      PLATFORM_SQLSERVER_HOST: sqlserver-not-used-in-this-job
      PLATFORM_SQLSERVER_USER: ci
      PLATFORM_SQLSERVER_PASSWORD: ci-only-sqlserver-0123456789abcdef
      PLATFORM_SQLSERVER_DATABASE: ci
      # 分片队列，指向本作业的 redis 服务容器
      PLATFORM_REDIS_HOST: localhost
      PLATFORM_REDIS_PORT: '56379'
      # ⚠ 与 AUTH_EDGE_SIGNING_SECRET 同值：这两个取值分叉就是全链路 401
      PLATFORM_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      # ⚠ 与 COLLECT_EDGE_SERVICE_KEY 同值：它守 /internal/ 的计划下发端点。
      # 少了它 Settings 构造不出来，`settings` 夹具会整包 skip——而 CI 里
      # skip 等于没跑，本地有 .env 兜着更看不出来
      PLATFORM_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      # 数据源口令的加密密钥。密钥类无默认值，少了它 Settings 整包构造失败
      PLATFORM_COLLECT_CREDENTIAL_SECRET: ci-only-credential-0123456789abcdef
      # 对象存储在 CI 里没有实例，素材用例一律打假存储。⚠ endpoint 写成解析不出来
      # 的名字：真有用例去连它，要当场炸而不是连到别的什么东西上。
      # 迁移那步也要它们——alembic 的 env.py 装载完整 Settings，缺一项就退出。
      PLATFORM_OBJECTSTORE_ENDPOINT: http://objectstore-not-used-in-this-job:9000
      PLATFORM_OBJECTSTORE_BUCKET: ci-bucket
      PLATFORM_OBJECTSTORE_ACCESS_KEY: ci-only-objectstore-access
      PLATFORM_OBJECTSTORE_SECRET_KEY: ci-only-objectstore-0123456789abcdef

      OPCUA_POSTGRES_HOST: localhost
      OPCUA_POSTGRES_PORT: '55432'
      OPCUA_POSTGRES_USER: dt
      OPCUA_POSTGRES_PASSWORD: dt
      OPCUA_POSTGRES_DB: dt
      OPCUA_POSTGRES_SCHEMA: opcua
      OPCUA_REDIS_HOST: localhost
      OPCUA_REDIS_PORT: '56379'

      # ⚠ realtime-hub 的 JWT 密钥必须与 AUTH_JWT_SECRET 同值：它只验不签，
      # 分叉的表现是每一次 WS 握手都被判成伪造令牌
      REALTIME_POSTGRES_HOST: localhost
      REALTIME_POSTGRES_PORT: '55432'
      REALTIME_POSTGRES_USER: dt
      REALTIME_POSTGRES_PASSWORD: dt
      REALTIME_POSTGRES_DB: dt
      REALTIME_POSTGRES_SCHEMA: realtime
      REALTIME_REDIS_HOST: localhost
      REALTIME_REDIS_PORT: '56379'
      REALTIME_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      REALTIME_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      REALTIME_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef

      # ⚠ 助手的模型开关**在 CI 里保持关**：打开就要一把真密钥，而用例验的是
      # 编排与工具分派，模型本身由假件顶。开关关着时它照常构造得出 Settings
      ASSISTANT_POSTGRES_HOST: localhost
      ASSISTANT_POSTGRES_PORT: '55432'
      ASSISTANT_POSTGRES_USER: dt
      ASSISTANT_POSTGRES_PASSWORD: dt
      ASSISTANT_POSTGRES_DB: dt
      ASSISTANT_POSTGRES_SCHEMA: assistant
      ASSISTANT_REDIS_HOST: localhost
      ASSISTANT_REDIS_PORT: '56379'
      ASSISTANT_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      ASSISTANT_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef

      # ⚠ 知识库的嵌入档与对话档**在 CI 里保持关**：打开就要真密钥，而用例验的
      # 是解析、切块与检索的编排，模型本身由假件顶。关着时照常构造得出 Settings
      KNOWLEDGE_POSTGRES_HOST: localhost
      KNOWLEDGE_POSTGRES_PORT: '55432'
      KNOWLEDGE_POSTGRES_USER: dt
      KNOWLEDGE_POSTGRES_PASSWORD: dt
      KNOWLEDGE_POSTGRES_DB: dt
      KNOWLEDGE_POSTGRES_SCHEMA: knowledge
      KNOWLEDGE_REDIS_HOST: localhost
      KNOWLEDGE_REDIS_PORT: '56379'
      KNOWLEDGE_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      KNOWLEDGE_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      # 对象存储在 CI 里没有实例，摄取用例一律打假存储。⚠ endpoint 写成解析不
      # 出来的名字：真有用例去连它，要当场炸而不是连到别的什么东西上
      KNOWLEDGE_OBJECTSTORE_ENDPOINT: http://objectstore-not-used-in-this-job:9000
      KNOWLEDGE_OBJECTSTORE_BUCKET: ci-bucket
      KNOWLEDGE_OBJECTSTORE_ACCESS_KEY: ci-only-objectstore-access
      KNOWLEDGE_OBJECTSTORE_SECRET_KEY: ci-only-objectstore-0123456789abcdef

      COLLECT_POSTGRES_HOST: localhost
      COLLECT_POSTGRES_PORT: '55432'
      COLLECT_POSTGRES_USER: dt
      COLLECT_POSTGRES_PASSWORD: dt
      COLLECT_POSTGRES_DB: dt
      COLLECT_POSTGRES_SCHEMA: collect
      COLLECT_REDIS_HOST: localhost
      COLLECT_REDIS_PORT: '56379'
      # ⚠ 与 PLATFORM_EDGE_SERVICE_KEY 同值：这两个取值分叉，collector 拉计划
      # 就是 401，而现象只是「采不到数」
      COLLECT_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      # 私钥只落挂载卷；CI 里用一次性目录，随作业容器一起消失
      OPCUA_PKI_DIR: /tmp/opcua-pki-ci
      # ⚠ 迁移也要它们：alembic 的 env.py 装载完整 Settings，而配置是
      # 「启动即全量校验、缺失即退出」，少一个就在建 schema 那步失败。
      OPCUA_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      OPCUA_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-server

      # ⚠ 端口通了不等于能用了：GitHub 的服务容器有 health-cmd 守着，act 没有
      - name: 等依赖就绪
        run: |
          uv run --project server python scripts/wait_for_deps.py \
            "$LIB_TEST_POSTGRES_DSN" "$LIB_TEST_REDIS_URL"

      - name: 建 schema 与种子
        working-directory: server/services/auth-server
        run: |
          uv run alembic upgrade head
          uv run python -m scripts.seed

      - name: 建 platform schema
        working-directory: server/services/platform-server
        run: uv run alembic upgrade head

      - name: 建 opcua schema
        working-directory: server/services/opcua-server
        run: uv run alembic upgrade head

      - name: 建 collect schema
        working-directory: server/services/collector-server
        run: uv run alembic upgrade head

      - name: 建 realtime schema
        working-directory: server/services/realtime-hub
        run: uv run alembic upgrade head

      - name: 建 assistant schema
        working-directory: server/services/ai-assistant
        run: uv run alembic upgrade head

      - name: 建 knowledge schema
        working-directory: server/services/knowledge-server
        run: uv run alembic upgrade head

      # ⚠ --cov 必须用点号模块名：写成路径形式时 coverage 静默跳过、数字虚高
      - name: lib 单元 + 契约
        working-directory: server/lib
        run: |
          set -o pipefail
          uv run pytest -q --cov=lib --cov-branch \
            --cov-report=xml:../../lib-coverage.xml \
            --junitxml=../../lib-junit.xml 2>&1 | tee ../../lib-pytest.log

      - name: domain/timeseries 单元 + 契约
        working-directory: server/domain/timeseries
        run: |
          set -o pipefail
          uv run pytest -q --cov=timeseries --cov-branch \
            --cov-report=xml:../../../timeseries-coverage.xml \
            --junitxml=../../../timeseries-junit.xml 2>&1 \
            | tee ../../../timeseries-pytest.log

      - name: domain/collectwire 单元 + 契约
        working-directory: server/domain/collectwire
        run: |
          set -o pipefail
          uv run pytest -q --cov=collectwire --cov-branch \
            --cov-report=xml:../../../collectwire-coverage.xml \
            --junitxml=../../../collectwire-junit.xml 2>&1 \
            | tee ../../../collectwire-pytest.log

      - name: auth-server 全层
        working-directory: server/services/auth-server
        run: |
          set -o pipefail
          uv run pytest -q --cov=auth_server --cov-branch \
            --cov-report=xml:../../../auth-coverage.xml \
            --junitxml=../../../auth-junit.xml 2>&1 | tee ../../../auth-pytest.log

      - name: platform-server 全层
        working-directory: server/services/platform-server
        run: |
          set -o pipefail
          uv run pytest -q --cov=platform_server --cov-branch \
            --cov-report=xml:../../../platform-coverage.xml \
            --junitxml=../../../platform-junit.xml 2>&1 \
            | tee ../../../platform-pytest.log

      # ⚠ COVERAGE_CORE=sysmon 与 `branch = false` 是一对，缺一个就挂死：
      # coverage 的默认追踪器会被 asyncua 那个 78000 行的生成函数拖住，
      # 单条起真实 Server 的用例 >200s 不返回。理由与补偿见 ADR-0008。
      - name: opcua-server 全层
        working-directory: server/services/opcua-server
        env:
          COVERAGE_CORE: sysmon
        run: |
          set -o pipefail
          uv run pytest -q --cov=opcua_server \
            --cov-report=xml:../../../opcua-coverage.xml \
            --junitxml=../../../opcua-junit.xml 2>&1 \
            | tee ../../../opcua-pytest.log

      - name: collector-server 全层
        working-directory: server/services/collector-server
        run: |
          set -o pipefail
          uv run pytest -q --cov=collector_server --cov-branch \
            --cov-report=xml:../../../collector-coverage.xml \
            --junitxml=../../../collector-junit.xml 2>&1 \
            | tee ../../../collector-pytest.log

      # ⚠ 匿名订阅那条路（ADR-0021）只有真库能验：授权表、外键级联与真实握手
      - name: realtime-hub 全层
        working-directory: server/services/realtime-hub
        run: |
          set -o pipefail
          uv run pytest -q --cov=realtime_hub --cov-branch \
            --cov-report=xml:../../../realtime-coverage.xml \
            --junitxml=../../../realtime-junit.xml 2>&1 \
            | tee ../../../realtime-pytest.log

      # ⚠ 停在等浏览器那一步只有真库能验：待续状态必须落库，api 角色是无状态的
      - name: ai-assistant 全层
        working-directory: server/services/ai-assistant
        run: |
          set -o pipefail
          uv run pytest -q --cov=ai_assistant --cov-branch \
            --cov-report=xml:../../../assistant-coverage.xml \
            --junitxml=../../../assistant-junit.xml 2>&1 \
            | tee ../../../assistant-pytest.log

      # ⚠ 索引档的两条实现只有真库能分开验：pgvector 装没装决定走哪一路，
      # 而回退那一路平时没人跑，长期没人跑等于没有
      - name: knowledge-server 全层
        working-directory: server/services/knowledge-server
        run: |
          set -o pipefail
          uv run pytest -q --cov=knowledge_server --cov-branch \
            --cov-report=xml:../../../knowledge-coverage.xml \
            --junitxml=../../../knowledge-junit.xml 2>&1 \
            | tee ../../../knowledge-pytest.log

      # CI 里 skip 掉的用例等于没跑：环境能力由服务容器保证，缺了就该红
      - name: 运行结果自检（无 skip、无外网、覆盖率口径）
        run: |
          uv run --project server python scripts/gates/check_pytest_run.py \
            lib-junit.xml lib-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            timeseries-junit.xml timeseries-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            collectwire-junit.xml collectwire-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            auth-junit.xml auth-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            platform-junit.xml platform-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            opcua-junit.xml opcua-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            collector-junit.xml collector-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            realtime-junit.xml realtime-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            assistant-junit.xml assistant-pytest.log
          uv run --project server python scripts/gates/check_pytest_run.py \
            knowledge-junit.xml knowledge-pytest.log

      # 整体覆盖率不许低于基线——哪怕仍在阈值之上
      - name: 覆盖率棘轮
        run: |
          uv run --project server python scripts/gates/check_coverage.py \
            lib lib-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            timeseries timeseries-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            collectwire collectwire-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            auth-server auth-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            platform-server platform-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            opcua-server opcua-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            collector-server collector-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            realtime-hub realtime-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            ai-assistant assistant-coverage.xml
          uv run --project server python scripts/gates/check_coverage.py \
            knowledge-server knowledge-coverage.xml

      # 基线是**本次推送前的 main**（`github.event.before`）：刚合进来的那一坨
      # 改动正好落在这段区间里。⚠ 没有 before（分支首推、手动补跑）时无基线
      # 可比，只能不判——本地 `ci-local.sh --all` 会把它填成与 origin/main 的
      # 合并基，于是合并前在本地判的与合并后在这里判的是同一段 diff
      - name: 增量覆盖 ≥85%
        env:
          BASELINE: ${{ github.event.before }}
        run: |
          if ! [[ "${BASELINE}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASELINE}" =~ ^0+$ ]]; then
            echo '::notice::没有可比的基线提交，本轮不判增量覆盖'
            exit 0
          fi
          git cat-file -e "${BASELINE}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "${BASELINE}"
          uv run --project server diff-cover \
            lib-coverage.xml timeseries-coverage.xml \
            collectwire-coverage.xml auth-coverage.xml \
            platform-coverage.xml opcua-coverage.xml \
            collector-coverage.xml realtime-coverage.xml \
            assistant-coverage.xml \
            --compare-branch "${BASELINE}" --fail-under=85

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && !env.ACT
        with:
          name: server-coverage
          path: '*-coverage.xml'
          retention-days: 7

  web-test:
    name: 3·前端测试与覆盖率
    needs: [web-static]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-server

      # 阈值写在 vitest.config.ts 里，本地与 CI 同一份口径
      - name: 单元 + 组件 + 契约（含覆盖率阈值）
        working-directory: web
        run: pnpm test:coverage

      # SF 与 diff 对不上时 diff-cover 不报错、只报「0 行」照样放行——先验口径
      - name: lcov 路径口径自检
        run: |
          uv run --project server python scripts/gates/check_lcov_paths.py \
            web/coverage/lcov.info

      - name: 覆盖率棘轮
        run: |
          uv run --project server python scripts/gates/check_coverage.py \
            web web/coverage/lcov.info

      # 基线口径与后端那步同一条，理由见那里
      - name: 增量覆盖 ≥85%
        env:
          BASELINE: ${{ github.event.before }}
        run: |
          if ! [[ "${BASELINE}" =~ ^[0-9a-f]{40}$ ]] || [[ "${BASELINE}" =~ ^0+$ ]]; then
            echo '::notice::没有可比的基线提交，本轮不判增量覆盖'
            exit 0
          fi
          git cat-file -e "${BASELINE}^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "${BASELINE}"
          uv run --project server diff-cover web/coverage/lcov.info \
            --compare-branch "${BASELINE}" --fail-under=85

  # ============ 第 4 段：契约、构建与供应链 ============
  contracts:
    name: 4·契约与迁移可逆性
    needs: [server-test]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt
          POSTGRES_DB: dt
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U dt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTH_POSTGRES_HOST: localhost
      AUTH_POSTGRES_PORT: '55432'
      AUTH_POSTGRES_USER: dt
      AUTH_POSTGRES_PASSWORD: dt
      AUTH_POSTGRES_DB: dt
      AUTH_POSTGRES_SCHEMA: auth
      AUTH_REDIS_HOST: redis-not-used-in-this-job
      MIGRATION_DSN: postgresql+asyncpg://dt:dt@localhost:55432/dt
      AUTH_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      AUTH_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      AUTH_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      PLATFORM_POSTGRES_HOST: localhost
      PLATFORM_POSTGRES_PORT: '55432'
      PLATFORM_POSTGRES_USER: dt
      PLATFORM_POSTGRES_PASSWORD: dt
      PLATFORM_POSTGRES_DB: dt
      PLATFORM_POSTGRES_SCHEMA: platform
      PLATFORM_SQLSERVER_HOST: sqlserver-not-used-in-this-job
      PLATFORM_SQLSERVER_USER: ci
      PLATFORM_SQLSERVER_PASSWORD: ci-only-sqlserver-0123456789abcdef
      PLATFORM_SQLSERVER_DATABASE: ci
      PLATFORM_REDIS_HOST: redis-not-used-in-this-job
      PLATFORM_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
      PLATFORM_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
      PLATFORM_COLLECT_CREDENTIAL_SECRET: ci-only-credential-0123456789abcdef
      # 这一段只导 openapi 与跑迁移，一个字节都不读；但配置是启动即全量校验，
      # 少一项就在导出那步退出。⚠ endpoint 同样写成解析不出来的名字
      PLATFORM_OBJECTSTORE_ENDPOINT: http://objectstore-not-used-in-this-job:9000
      PLATFORM_OBJECTSTORE_BUCKET: ci-bucket
      PLATFORM_OBJECTSTORE_ACCESS_KEY: ci-only-objectstore-access
      PLATFORM_OBJECTSTORE_SECRET_KEY: ci-only-objectstore-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-server

      - name: 等依赖就绪
        run: uv run --project server python scripts/wait_for_deps.py "$MIGRATION_DSN"

      # openapi.json 是前后端之间唯一的类型真源：重新生成必须逐字节一致
      - name: auth openapi.json 与代码一致
        working-directory: server/services/auth-server
        run: uv run python -m scripts.export_openapi --check

      - name: platform openapi.json 与代码一致
        working-directory: server/services/platform-server
        run: uv run python -m scripts.export_openapi --check

      # ⚠ 按路径调而不是 console 入口：`scripts` 是顶层包名，auth-server 已把
      # 它打进 wheel，同一个 venv 里两份会互相覆盖，导出脚本可能改写**另一个
      # 服务**的 openapi.json。理由与实测见 opcua-server 的 pyproject。
      - name: opcua-server 的 openapi.json 与代码一致
        working-directory: server/services/opcua-server
        env:
          OPCUA_POSTGRES_HOST: localhost
          OPCUA_POSTGRES_PORT: '55432'
          OPCUA_POSTGRES_USER: dt
          OPCUA_POSTGRES_PASSWORD: dt
          OPCUA_POSTGRES_DB: dt
          OPCUA_POSTGRES_SCHEMA: opcua
          OPCUA_REDIS_HOST: redis-not-used-in-this-job
          OPCUA_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
          OPCUA_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
        run: uv run python scripts/export_openapi.py --check

      - name: ai-assistant 的 openapi.json 与代码一致
        working-directory: server/services/ai-assistant
        env:
          ASSISTANT_POSTGRES_HOST: localhost
          ASSISTANT_POSTGRES_PORT: '55432'
          ASSISTANT_POSTGRES_USER: dt
          ASSISTANT_POSTGRES_PASSWORD: dt
          ASSISTANT_POSTGRES_DB: dt
          ASSISTANT_POSTGRES_SCHEMA: assistant
          ASSISTANT_REDIS_HOST: redis-not-used-in-this-job
          ASSISTANT_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
          ASSISTANT_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
        run: uv run python scripts/export_openapi.py --check

      - name: knowledge-server 的 openapi.json 与代码一致
        working-directory: server/services/knowledge-server
        env:
          KNOWLEDGE_POSTGRES_HOST: localhost
          KNOWLEDGE_POSTGRES_PORT: '55432'
          KNOWLEDGE_POSTGRES_USER: dt
          KNOWLEDGE_POSTGRES_PASSWORD: dt
          KNOWLEDGE_POSTGRES_DB: dt
          KNOWLEDGE_POSTGRES_SCHEMA: knowledge
          KNOWLEDGE_REDIS_HOST: redis-not-used-in-this-job
          KNOWLEDGE_OBJECTSTORE_ENDPOINT: http://objectstore-not-used-in-this-job:9000
          KNOWLEDGE_OBJECTSTORE_BUCKET: ci-bucket
          KNOWLEDGE_OBJECTSTORE_ACCESS_KEY: ci-only-objectstore-access
          KNOWLEDGE_OBJECTSTORE_SECRET_KEY: ci-only-objectstore-0123456789abcdef
          KNOWLEDGE_EDGE_SIGNING_SECRET: ci-only-edge-signing-0123456789abcdef
          KNOWLEDGE_EDGE_SERVICE_KEY: ci-only-edge-service-0123456789abcdef
        run: uv run python scripts/export_openapi.py --check

      # ⚠ 代码可以回滚、数据库不回滚，所以每个迁移都必须真的能上能下
      - name: auth 迁移 upgrade → downgrade → upgrade
        working-directory: server/services/auth-server
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: platform 迁移 upgrade → downgrade → upgrade
        working-directory: server/services/platform-server
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: opcua-server 的迁移 upgrade → downgrade → upgrade
        working-directory: server/services/opcua-server
        env:
          OPCUA_POSTGRES_HOST: localhost
          OPCUA_POSTGRES_PORT: '55432'
          OPCUA_POSTGRES_USER: dt
          OPCUA_POSTGRES_PASSWORD: dt
          OPCUA_POSTGRES_DB: dt
          OPCUA_POSTGRES_SCHEMA: opcua
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: realtime-hub 的迁移 upgrade → downgrade → upgrade
        working-directory: server/services/realtime-hub
        env:
          REALTIME_POSTGRES_HOST: localhost
          REALTIME_POSTGRES_PORT: '55432'
          REALTIME_POSTGRES_USER: dt
          REALTIME_POSTGRES_PASSWORD: dt
          REALTIME_POSTGRES_DB: dt
          REALTIME_POSTGRES_SCHEMA: realtime
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: ai-assistant 的迁移 upgrade → downgrade → upgrade
        working-directory: server/services/ai-assistant
        env:
          ASSISTANT_POSTGRES_HOST: localhost
          ASSISTANT_POSTGRES_PORT: '55432'
          ASSISTANT_POSTGRES_USER: dt
          ASSISTANT_POSTGRES_PASSWORD: dt
          ASSISTANT_POSTGRES_DB: dt
          ASSISTANT_POSTGRES_SCHEMA: assistant
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: knowledge-server 的迁移 upgrade → downgrade → upgrade
        working-directory: server/services/knowledge-server
        env:
          KNOWLEDGE_POSTGRES_HOST: localhost
          KNOWLEDGE_POSTGRES_PORT: '55432'
          KNOWLEDGE_POSTGRES_USER: dt
          KNOWLEDGE_POSTGRES_PASSWORD: dt
          KNOWLEDGE_POSTGRES_DB: dt
          KNOWLEDGE_POSTGRES_SCHEMA: knowledge
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  web-build:
    name: 4·前端构建与包体预算
    needs: [web-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-web

      # ⚠ build 不能省：它是 SFC 里 <style lang="scss"> 的唯一编译者。一段
      # 花括号不配对的 SCSS 能一路通过 format / lint / typecheck / 全部用例
      - name: 构建
        working-directory: web
        run: pnpm build

      - uses: ./.github/actions/setup-gates
      - name: 首屏包体预算
        run: |
          uv run --python 3.12 --no-project python \
            scripts/gates/check_bundle_budget.py

  supply-chain:
    name: 4·依赖漏洞与许可证
    needs: [server-static, web-static]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-server
      - uses: ./.github/actions/setup-web

      - name: 许可证（GPL/AGPL 即阻断）
        run: uv run --project server python scripts/gates/check_licenses.py

      # ⚠ 审的是导出的第三方依赖清单，不是环境：本仓自己的 workspace 成员是
      # 可编辑安装、也不在 PyPI 上，直接审环境会让 `--strict` 把「查不到自己」
      # 当成失败，而放弃 `--strict` 又会把真正查不到的第三方包一起放过去。
      - name: Python 依赖漏洞
        run: |
          uv export --project server --no-dev --no-emit-workspace \
            --format requirements.txt > requirements-audit.txt
          uv run --project server --with pip-audit==2.9.0 \
            pip-audit --strict --requirement requirements-audit.txt

      - name: Node 依赖漏洞（高危即阻断）
        working-directory: web
        run: pnpm audit --audit-level=high

  # ============ 第 5 段：汇总 ============
  gate:
    name: 5·全部闸门
    if: always()
    needs:
      - secrets
      - hygiene
      - structure
      - server-static
      - web-static
      - server-test
      - web-test
      - contracts
      - web-build
      - supply-chain
    runs-on: ubuntu-24.04
    steps:
      # 只有这个作业需要设成分支保护里的必需检查：任一上游没成功即失败，
      # 包括被跳过的——跳过的闸门不算通过
      - name: 汇总
        run: |
          printf '%s\n' '${{ toJSON(needs) }}' | tee results.json
          if grep -qE '"result": *"(failure|cancelled|skipped)"' results.json; then
            echo '::error::有闸门未通过，见上面的作业'
            exit 1
          fi
          echo '全部闸门通过'
