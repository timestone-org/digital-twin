name: 装配后端工作区
description: 装 uv 与锁定的依赖。全部作业共用一份，避免各写各的版本。

inputs:
  groups:
    description: 是否装 dev 依赖组（跑测试与静态检查要，只跑脚本不要）
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: 装 uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
      with:
        version: '0.11.28'
        # ⚠ 自托管运行器是常驻的，`~/.cache/uv` 本来就留在盘上，装依赖照样是
        # 从本地 store 硬链。再叠一层 Actions 缓存只会把归档解到**已经存在**
        # 的文件上：tar 报 `Cannot open: File exists` + 退出码 2，
        # 每轮一条红字警告，而它什么也没加速。
        enable-cache: false

    # ⚠ --frozen：锁文件与 pyproject 不一致时直接失败，而不是悄悄解出另一套版本
    - name: 装依赖
      shell: bash
      working-directory: server
      run: |
        if [ "${{ inputs.groups }}" = "true" ]; then
          uv sync --all-packages --frozen
        else
          uv sync --all-packages --frozen --no-dev
        fi
