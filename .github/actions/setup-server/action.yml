name: 装配后端工作区
description: 装 uv 与锁定的依赖。全部作业共用一份，避免各写各的版本。

inputs:
  groups:
    description: 是否装 dev 依赖组（跑测试与静态检查要，只跑脚本不要）
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: 装 uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
      with:
        version: '0.11.28'
        # ⚠ 运行器是一次性的，`~/.cache/uv` 每轮从零开始——这层缓存省的是整份
        # 依赖的下载。缓存键跟着锁文件走，锁文件不变才命中。
        enable-cache: true
        cache-dependency-glob: 'server/uv.lock'

    # ⚠ --frozen：锁文件与 pyproject 不一致时直接失败，而不是悄悄解出另一套版本
    - name: 装依赖
      shell: bash
      working-directory: server
      run: |
        if [ "${{ inputs.groups }}" = "true" ]; then
          uv sync --all-packages --frozen
        else
          uv sync --all-packages --frozen --no-dev
        fi
