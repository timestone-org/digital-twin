name: 装配闸门脚本的解释器
description: 只装 uv 与一个 3.12 解释器。闸门脚本只用标准库，不需要装项目依赖。

runs:
  using: composite
  steps:
    # ⚠ 不能用运行器自带的 `python3`：自托管运行器上它可能是 3.9/3.10，
    # 而闸门脚本用了 3.12 的语法（`type` 别名、`X | Y` 形式的 isinstance）。
    # GitHub 托管镜像上它恰好是 3.12，于是这类差异只会在自托管上炸。
    - name: 装 uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
      with:
        version: '0.11.28'
        # 理由同 setup-server：常驻运行器上这层缓存只会解压失败
        enable-cache: false

    - name: 备一个 3.12
      shell: bash
      run: uv python install 3.12
