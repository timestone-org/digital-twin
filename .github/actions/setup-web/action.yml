name: 装配前端工作区
description: 装 pnpm、Node 与锁定的依赖。版本取自 web/package.json 的 packageManager。

runs:
  using: composite
  steps:
    - name: 装 pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        package_json_file: web/package.json

    - name: 装 Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
        # ⚠ 运行器是一次性的，pnpm 的 store 每轮从零开始——缓存它省的是整份
        # 依赖的下载。⚠ 必须指到 `web/` 下那份锁文件：仓库根没有锁文件，
        # 不指路 setup-node 会以「找不到锁文件」直接失败。
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    # ⚠ --frozen-lockfile：锁文件与 package.json 不一致时失败，
    # 而不是就地改锁文件——那会让 CI 装的和本地装的不是同一套
    - name: 装依赖
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
