name: 装配前端工作区
description: 装 pnpm、Node 与锁定的依赖。版本取自 web/package.json 的 packageManager。

runs:
  using: composite
  steps:
    - name: 装 pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        package_json_file: web/package.json

    - name: 装 Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
        # ⚠ 不开 `cache: pnpm`：常驻运行器上 pnpm 的 store 本来就在盘上，
        # 装依赖是从它硬链过来的。Actions 缓存这一层解压到已存在的文件上会
        # 失败（tar 退出码 2），加速为零、噪音为一条警告。

    # ⚠ --frozen-lockfile：锁文件与 package.json 不一致时失败，
    # 而不是就地改锁文件——那会让 CI 装的和本地装的不是同一套
    - name: 装依赖
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
